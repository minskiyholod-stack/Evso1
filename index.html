<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>evso</title>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="evso">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
[hidden] { display: none !important; }
:root{
  --bg:#f5f5f5;--card:#fff;--border:#e0e0e0;--text:#111;--muted:#737373;
  --black:#000;--white:#fff;--hover:#f0f0f0;--radius:10px;--danger:#dc2626;--success:#16a34a;
  --wh1:#ef4444;--wh2:#3b82f6;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
body.dark {
  --bg: #0a0a0a; --card: #171717; --border: #2a2a2a; --text: #ededed;
  --muted: #8b8b8b; --black: #ffffff; --white: #000000; --hover: #222222;
}
body.dark .login-card, body.dark .app-header, body.dark .install-banner,
body.dark .modal, body.dark .sales-wrap, body.dark .settings-section,
body.dark .product-card, body.dark .stat, body.dark .menu-card,
body.dark .role-card, body.dark .log-item { background-color: var(--card); }
body.dark .btn { border-color: var(--border); }
body.dark .btn.primary { background: var(--white); color: var(--black); border-color: var(--white); }
body.dark .dot-online.off { background: #555; }
body.dark .hint-box { background: #2a2412; border-color: #443a16; color: #f0d98a; }
body.dark .status-line.ok { background: #14291e; color: #8ff0b4; border-color: #1f4d33; }
body.dark .status-line.warn { background: #2a2412; color: #f0d98a; border-color: #443a16; }
body.dark .status-line.err { background: #2a1212; color: #f08a8a; border-color: #441616; }
body.dark .view-size-row, body.dark .view-photo, body.dark .esr-qty button, body.dark .edit-size-row { background: #222; }
body.dark .toast { background: #fff; color: #000; }
body.dark .user-row { background: #222; }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:hidden;height:100%}
body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.4;
  overflow-x:hidden;width:100%;min-height:100%;transition:background .2s,color .2s;
  -webkit-text-size-adjust:100%;overscroll-behavior-x:none}
input,select,textarea,button{font-family:inherit;font-size:16px}

#app, #shopScreen, #welcomeScreen { animation: fadeIn 0.3s ease-in-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

.sync-bar{position:fixed;top:0;left:0;right:0;z-index:500;
  background:var(--danger);color:#fff;padding:8px 16px;
  padding-top:calc(8px + var(--safe-top));
  font-size:12.5px;font-weight:600;text-align:center;
  box-shadow:0 2px 12px rgba(0,0,0,.15)}
body.has-sync-bar .app-header{padding-top:calc(var(--safe-top) + 34px)}
body.has-sync-bar main{padding-top:calc(16px + 34px)}

.toast{position:fixed;left:50%;bottom:calc(20px + var(--safe-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--black);color:var(--white);padding:12px 18px;border-radius:10px;
  font-size:14px;font-weight:500;z-index:300;opacity:0;transition:all .25s;
  pointer-events:none;max-width:calc(100% - 32px);text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:var(--danger);color:#fff !important}
.toast.success{background:var(--success);color:#fff !important}

.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:32px 24px;width:100%;max-width:420px;box-shadow:0 4px 24px rgba(0,0,0,.05)}
.login-logo{font-size:36px;font-weight:900;letter-spacing:-1.5px;text-align:center;margin-bottom:2px}
.login-logo span{color:var(--muted)}
.login-sub{text-align:center;color:var(--muted);margin-bottom:24px;font-size:13px}
.login-card label{display:block;margin-bottom:12px;font-size:13px;color:var(--muted);font-weight:500}
.login-card input{display:block;width:100%;margin-top:5px;background:var(--card);
  border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);font-size:16px}
.login-card input:focus{outline:none;border-color:var(--black)}
.btn.full{width:100%;margin-top:8px}
.login-error{color:var(--danger);text-align:center;margin-top:12px;font-size:13px;min-height:18px}
.login-hint{text-align:center;margin-top:12px;font-size:11.5px;color:var(--muted);line-height:1.4}

.btn{background:var(--card);border:1px solid var(--border);color:var(--text);
  font-weight:500;padding:9px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;font-size:14px;
  min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:4px;text-decoration:none}
.btn:active{background:var(--hover)}
.btn.primary{background:var(--black);border-color:var(--black);color:var(--white)}
.btn.primary:active{background:#222}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.small{padding:6px 10px;font-size:13px;min-height:34px}

.role-card{background:var(--card);border:2px solid var(--border);border-radius:16px;
  padding:28px 16px;cursor:pointer;text-align:center;color:var(--text);
  transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-family:inherit;width:100%}
.role-card:hover{border-color:var(--black);background:var(--hover)}
.role-card:active{transform:scale(.98)}
.role-icon{font-size:56px;line-height:1;margin-bottom:10px}
.role-title{font-weight:800;font-size:17px}
.role-desc{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.4}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
@media(max-width:400px){.role-grid{grid-template-columns:1fr}}

.app-header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--border);padding-top:var(--safe-top);transition:padding-top .2s}
.header-top{display:flex;align-items:center;gap:10px;padding:10px 16px 8px}
.logo{font-size:22px;font-weight:900;letter-spacing:-1.2px;cursor:pointer;user-select:none}
.logo span{color:var(--muted)}
.spacer{flex:1}
.user-chip{display:flex;align-items:center;gap:6px;background:var(--hover);
  padding:5px 11px;border-radius:20px;font-size:13px;font-weight:500;flex-shrink:0}
.dot-online{width:8px;height:8px;border-radius:50%;background:var(--success);flex-shrink:0}
.dot-online.off{background:#9ca3af}.dot-online.err{background:var(--danger)}
.user-chip button{background:none;border:none;color:var(--muted);cursor:pointer;padding:0 0 0 4px;font-size:12.5px}
.user-chip button:hover{color:var(--text)}
.role-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:800;
  padding:2px 6px;border-radius:6px;text-transform:uppercase;letter-spacing:.4px}
.role-badge.admin{background:rgba(239,68,68,.15);color:var(--wh1)}
.role-badge.worker{background:rgba(59,130,246,.15);color:var(--wh2)}
.theme-toggle{background:none;border:none;color:var(--text);cursor:pointer;font-size:20px;
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  border-radius:8px;flex-shrink:0}
.theme-toggle:active{background:var(--hover)}

.main-nav{display:flex;gap:2px;padding:0 16px 10px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none}
.main-nav::-webkit-scrollbar{display:none}
.main-nav button{background:none;border:none;color:var(--muted);font-weight:500;
  padding:8px 13px;border-radius:8px;cursor:pointer;font-size:14px;white-space:nowrap;flex-shrink:0}
.main-nav button:hover{color:var(--text);background:var(--hover)}
.main-nav button.active{background:var(--black);color:var(--white)}

main{max-width:1280px;margin:0 auto;padding:16px;padding-bottom:calc(16px + var(--safe-bottom));overflow-x:hidden;width:100%}
@media(max-width:600px){main{padding:12px}}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.stat .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.stat .v{font-size:20px;font-weight:800;margin-top:3px}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr;gap:8px}}

.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.search{flex:1;min-width:130px;background:var(--card);border:1px solid var(--border);
  border-radius:8px;padding:10px 12px;color:var(--text);font-size:16px}
.search:focus{outline:none;border-color:var(--black)}
select.search{flex:0 0 auto;min-width:auto;padding-right:24px;font-size:15px}

.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
@media(max-width:600px){.product-grid{grid-template-columns:repeat(2,1fr);gap:8px}}
.product-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;display:flex;flex-direction:column;position:relative;transition:border-color .15s,transform .12s;cursor:pointer}
.product-card:active{transform:scale(.99)}
.product-card .photo{aspect-ratio:1;background:var(--hover);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.product-card .photo img{width:100%;height:100%;object-fit:cover}
.photo-placeholder{font-size:42px;opacity:.25}
.product-card .info{padding:8px 10px 10px;flex:1;display:flex;flex-direction:column;gap:2px}
.product-card .brand{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.product-card .name{font-size:13px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product-card .meta{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:var(--muted);margin-top:2px;gap:4px;flex-wrap:wrap}
.product-card .price{color:var(--text);font-size:13px;font-weight:700}
.shop-price{font-weight:800;font-size:16px;margin-top:4px}
.total-qty{margin-top:8px;padding-top:6px;border-top:1px dashed var(--border);font-size:12px;color:var(--muted)}
.total-qty b{color:var(--text);font-size:15px;font-weight:800;margin:0 2px}
.total-qty.empty-qty b{color:var(--danger)}
.card-buttons{margin-top:8px}
.sell-btn{width:100%;padding:8px;background:var(--black);color:var(--white);border:none;border-radius:8px;font-weight:600;font-size:12.5px;cursor:pointer;transition:background .12s;min-height:38px}
.sell-btn:active{background:#222}
.sell-btn:disabled{background:var(--border);color:var(--muted);cursor:not-allowed}
.card-bottom-actions{display:flex;gap:6px;margin-top:6px}
.card-bottom-actions .btn{flex:1;padding:7px 6px;font-size:12px;text-align:center;min-height:34px}
.no-stock-overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;text-align:center;padding:8px}

.empty{padding:50px 20px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--border);border-radius:var(--radius)}

.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:100;overflow-y:auto;padding-top:var(--safe-top);padding-bottom:var(--safe-bottom)}
.modal-backdrop.show{display:flex}
@media(min-width:700px){.modal-backdrop{align-items:flex-start;padding:20px}}
.modal{background:var(--card);border-radius:16px 16px 0 0;width:100%;max-width:520px;padding:20px;margin:0;max-height:calc(100vh - var(--safe-top) - var(--safe-bottom));overflow-y:auto;animation:slideUp .25s ease-out}
@keyframes slideUp{from{transform:translateY(30px);opacity:.6}to{transform:translateY(0);opacity:1}}
@media(min-width:700px){.modal{border-radius:14px;border:1px solid var(--border);max-height:calc(100vh - 40px);animation:fadeIn .2s ease-out}.modal.wide{max-width:580px}}
.modal h3{margin:0 0 16px;font-size:17px}
.modal label{display:block;margin-bottom:12px;font-size:13px;color:var(--muted);font-weight:500}
.modal input,.modal select{display:block;width:100%;margin-top:5px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:11px 12px;color:var(--text);font-size:16px}
.modal input:focus,.modal select:focus{outline:none;border-color:var(--black)}
.modal-actions{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.modal-actions > button,.modal-actions > a{flex:1;justify-content:center}
.modal-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.view-photo{aspect-ratio:1;max-height:200px;background:var(--hover);display:flex;align-items:center;justify-content:center;border-radius:10px;margin-bottom:14px;overflow:hidden}
.view-photo img{width:100%;height:100%;object-fit:cover}
.view-photo .photo-placeholder{font-size:52px}
.view-sizes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.view-size-row{display:flex;align-items:center;gap:4px;padding:7px 8px;background:var(--hover);border-radius:8px;font-weight:600;font-size:13px}
.view-size-row.out{opacity:.45}
.vsr-size{flex:1;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.vsr-wh{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 5px;border-radius:6px;font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums}
.vsr-wh.wh1{background:rgba(239,68,68,.15);color:var(--wh1)}
.vsr-wh.wh2{background:rgba(59,130,246,.15);color:var(--wh2)}

.photo-section{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.photo-preview{width:90px;height:90px;border-radius:10px;overflow:hidden;background:var(--hover);display:flex;align-items:center;justify-content:center;border:1px solid var(--border);flex-shrink:0}
.photo-preview img{width:100%;height:100%;object-fit:cover}
.photo-preview .photo-placeholder{font-size:28px}

.sizes-section{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.edit-size-row{display:flex;align-items:center;gap:5px;padding:8px 10px;background:var(--hover);border-radius:8px;margin-bottom:6px;flex-wrap:wrap}
.esr-size{font-size:15px;font-weight:800;min-width:28px;font-variant-numeric:tabular-nums}
.esr-qty{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:2px 4px}
.esr-qty.wh1{border-color:rgba(239,68,68,.5)}
.esr-qty.wh2{border-color:rgba(59,130,246,.5)}
.esr-label{font-size:11px;font-weight:800;margin-right:2px}
.esr-qty.wh1 .esr-label{color:var(--wh1)}
.esr-qty.wh2 .esr-label{color:var(--wh2)}
.esr-qty button{width:26px;height:26px;border:none;background:var(--card);border-radius:4px;cursor:pointer;font-size:16px;font-weight:700;color:var(--text);display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
.esr-qty button:active{background:var(--hover)}
.esr-val{min-width:22px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.esr-remove{margin-left:auto;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:0 6px;min-height:32px}
.size-preset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:5px}
.size-preset-btn{padding:9px 4px;background:var(--hover);border:1px solid var(--border);border-radius:6px;color:var(--text);font-weight:600;font-size:13px;cursor:pointer}
.size-preset-btn.active{background:var(--black);border-color:var(--black);color:var(--white)}
.delete-section{margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}

.sales-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--card)}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.sales-table{width:100%;border-collapse:collapse}
.sales-table th,.sales-table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:13px;white-space:nowrap}
.sales-table th{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;background:var(--hover)}
.sales-table tr:active td{background:var(--hover)}
.sales-table tr:last-child td{border-bottom:none}
.sales-table .num{text-align:right;font-variant-numeric:tabular-nums}
.sales-table td.wrap{white-space:normal;min-width:110px}
.sales-table tr.empty-day td{opacity:.45}

.filter-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;background:var(--black);color:var(--white);border-radius:20px;font-size:12px;font-weight:600}
.filter-badge button{background:none;border:none;color:inherit;cursor:pointer;font-size:16px;padding:0 0 0 2px;line-height:1}

.period-tabs{display:inline-flex;gap:2px;background:var(--hover);border-radius:8px;padding:3px;margin-bottom:14px}
.period-tabs button{background:none;border:none;padding:7px 13px;border-radius:6px;cursor:pointer;font-weight:500;color:var(--muted);font-size:13px}
.period-tabs button.active{background:var(--black);color:var(--white)}
.chart-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 12px 12px;margin-bottom:14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.chart-bars{display:flex;gap:3px;align-items:flex-end;height:180px;min-width:100%}
.chart-bar-wrap{flex:1;min-width:14px;display:flex;flex-direction:column;height:100%;cursor:pointer}
.chart-bar-inner{flex:1;display:flex;align-items:flex-end}
.chart-bar{width:100%;background:var(--black);border-radius:2px 2px 0 0;min-height:2px}
.chart-bar.zero{background:var(--border)}
.chart-bar-wrap.today .chart-bar:not(.zero){background:var(--success)}
.chart-label{font-size:9px;color:var(--muted);margin-top:5px;text-align:center;font-weight:600}
.chart-bar-wrap.today .chart-label{color:var(--text);font-weight:800}
.day-summary{padding:10px 14px;background:var(--hover);border-radius:8px;margin-bottom:16px;font-size:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.user-section{margin-bottom:16px}
.user-header{display:flex;justify-content:space-between;padding:8px 0;border-bottom:2px solid var(--black);font-weight:700;font-size:13.5px;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.user-sales{display:flex;flex-direction:column;gap:5px}
.sale-item{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;background:var(--hover);border-radius:6px;font-size:13px;align-items:center}
.sale-name{font-weight:600}
.sale-meta{color:var(--muted);font-size:11.5px;margin-top:2px}
.sale-price{font-weight:700;white-space:nowrap}
.hint-box{padding:10px 14px;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;margin-bottom:12px;font-size:12.5px;color:#78350f}

.log-item{background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start}
.log-icon{font-size:22px;line-height:1;flex-shrink:0;margin-top:2px}
.log-body{flex:1;min-width:0}
.log-title{font-weight:600;font-size:13.5px;margin-bottom:3px;word-break:break-word}
.log-meta{font-size:11.5px;color:var(--muted)}
.log-meta b{color:var(--text)}

.settings-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.settings-section h3{margin:0 0 12px;font-size:15px}
.settings-section label{display:block;margin-bottom:10px;font-size:13px;color:var(--muted);font-weight:500}
.settings-section input,.settings-section select{display:block;width:100%;margin-top:4px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:11px 12px;color:var(--text);font-size:16px}
.settings-section input:focus,.settings-section select:focus{outline:none;border-color:var(--black)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.status-line{padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:13px}
.status-line.ok{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
.status-line.warn{background:#fffbeb;color:#78350f;border:1px solid #fde68a}

</style>
</head>
<body>

    <div class="header-top">

<script>
/* ============ КОНСТАНТЫ ============ */
const DEFAULT_FB_URL = 'https://evso-cd735-default-rtdb.europe-west1.firebasedatabase.app';
const ADMIN_KEY = '20112001';   // ⚠️ ключ для регистрации магазина

const SAVE_DELAY = 500;
const RENDER_DELAY = 150;
const SEARCH_DELAY = 200;
const LOG_LIMIT_LOCAL = 200;
const PHOTO_MAX_SIZE = 350;
const PHOTO_QUALITY = 0.7;

const STATE_KEY = 'evso_state';
const PHOTOS_KEY = 'evso_photos';
const USER_KEY = 'evso_user';
const TENANT_KEY = 'evso_tenant';

const DEFAULT_BRANDS = ['Adidas','Nike','Reebok','Asics','Columbia','Hoka','Bona','Salomon','The North Face','New Balance','ACG','Saucony','Armani','Vans','DC','Merrell'];
const GENDERS = ['Мужские','Женские','Унисекс'];
const SEASONS = ['Зима','Лето','Всесезон'];

/* ============ PWA ============ */
(function setupPWA(){
  const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#000"/><text x="256" y="345" font-family="Arial,sans-serif" font-weight="900" font-size="360" fill="#fff" text-anchor="middle">e.</text></svg>`;
  const iconData = 'data:image/svg+xml;base64,' + btoa(iconSvg);
  const manifest = {
    name: 'evso', short_name: 'evso', description: 'Учёт склада обуви',
    start_url: window.location.pathname || '/', scope: window.location.pathname.replace(/[^/]*$/, '') || '/',
    display: 'standalone', orientation: 'portrait', background_color: '#f5f5f5', theme_color: '#000000',
    icons: [{ src: iconData, sizes: '192x192', type: 'image/svg+xml', purpose: 'any' },{ src: iconData, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }]
  };
  const manifestHref = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
  let link = document.querySelector('link[rel="manifest"]');
  if (!link) { link = document.createElement('link'); link.rel = 'manifest'; document.head.appendChild(link); }
  link.href = manifestHref;
  try {
    const c = document.createElement('canvas'); c.width = 512; c.height = 512;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 512, 512);
    ctx.fillStyle = '#fff'; ctx.font = '900 380px Arial,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('e.', 256, 280);
    const png = c.toDataURL('image/png');
    const ati = document.createElement('link'); ati.rel = 'apple-touch-icon'; ati.sizes = '512x512'; ati.href = png; document.head.appendChild(ati);
  } catch (e) {}
  const fav = document.createElement('link'); fav.rel = 'icon'; fav.type = 'image/svg+xml'; fav.href = iconData; document.head.appendChild(fav);
})();
let deferredInstallPrompt = null;
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredInstallPrompt = e; });
window.addEventListener('appinstalled', () => { hideInstallBanner(); });
function showInstallBanner(platform) {
  if (isStandalone) return;
  const banner = document.getElementById('installBanner'); if (!banner) return;
  if (platform === 'ios') {
    banner.innerHTML = `<div class="install-banner-inner"><div class="install-banner-icon">📱</div><div class="install-banner-text"><b>Установить evso</b>Открыть в Safari → Поделиться → На экран «Домой»</div><div class="install-banner-actions"><button class="btn ghost" onclick="dismissInstallBanner()">✕</button></div></div>`;
  } else {
    banner.innerHTML = `<div class="install-banner-inner"><div class="install-banner-icon">📱</div><div class="install-banner-text"><b>Установить evso</b>Открывать как приложение</div><div class="install-banner-actions"><button class="btn ghost" onclick="dismissInstallBanner()">Позже</button><button class="btn primary" onclick="triggerInstall()">Установить</button></div></div>`;
  }
  banner.hidden = false;
}
function hideInstallBanner() { const b = document.getElementById('installBanner'); if (b) b.hidden = true; }
function dismissInstallBanner() { hideInstallBanner(); localStorage.setItem('evso_banner_dismissed', '1'); }
async function triggerInstall() {
  if (!deferredInstallPrompt) { alert('Установка недоступна. Откройте по ссылке https:// в Chrome.'); return; }
  deferredInstallPrompt.prompt(); await deferredInstallPrompt.userChoice; deferredInstallPrompt = null; hideInstallBanner();
}

/* ============ ГЛОБАЛЬНОЕ СОСТОЯНИЕ ============ */
let state = {
  warehouses: { wh1:{name:'Точка 1'}, wh2:{name:'Точка 2'} },
  products: {}, sales: {}, log: {}, users: {}, customBrands: [],
  settings: { sellerTelegram: '', showOutOfStock: true }
};
let db = null, useFirebase = false, currentUser = '', activeTab = 'menu';
let filters = { search:'', brand:'', gender:'', season:'', size:'' };
let shopFilters = { search:'', brand:'', size:'', gender:'', season:'', sort:'default' };
let editingProduct = null, editingPhoto = '';
let statsPeriod = 30;
let firebaseReady = false;
let syncOnline = false, syncError = false;
let TENANT = '';

const $ = id => document.getElementById(id);
let uidCounter = 0;
const uid = p => (p||'x') + Date.now().toString(36) + '_' + (++uidCounter).toString(36) + Math.random().toString(36).slice(2,5);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('ru-RU', { maximumFractionDigits: 2 });
const dayKey = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const qty = v => { const n = parseInt(v); return isNaN(n) ? 0 : n; };
const plural = (n, one, few, many) => { const m = n % 100; if (m >= 11 && m <= 19) return many; const m10 = n % 10; if (m10 === 1) return one; if (m10 >= 2 && m10 <= 4) return few; return many; };

/* ============ MULTI-TENANT ============ */
function getTenantFromUrl() {
  const p = new URLSearchParams(window.location.search);
  return p.get('shop') || p.get('t') || '';
}
function getTenant() {
  if (TENANT) return TENANT;
  const fromUrl = getTenantFromUrl();
  if (fromUrl) { TENANT = fromUrl; return fromUrl; }
  const saved = localStorage.getItem(TENANT_KEY) || '';
  TENANT = saved;
  return saved;
}
function setTenant(t) {
  if (TENANT !== t) {
    try { localStorage.removeItem(STATE_KEY); localStorage.removeItem(PHOTOS_KEY); } catch (e) {}
    state = { warehouses: { wh1:{name:'Точка 1'}, wh2:{name:'Точка 2'} }, products: {}, sales: {}, log: {}, users: {}, customBrands: [], settings: { sellerTelegram: '', showOutOfStock: true } };
  }
  TENANT = t;
  try { localStorage.setItem(TENANT_KEY, t); } catch (e) {}
  const u = new URL(window.location.href);
  u.searchParams.set('shop', t);
  u.searchParams.delete('admin');
  window.history.replaceState({}, '', u.toString());
}
function clearTenant() {
  TENANT = '';
  try { localStorage.removeItem(TENANT_KEY); localStorage.removeItem(STATE_KEY); localStorage.removeItem(PHOTOS_KEY); } catch (e) {}
  state = { warehouses: { wh1:{name:'Точка 1'}, wh2:{name:'Точка 2'} }, products: {}, sales: {}, log: {}, users: {}, customBrands: [], settings: { sellerTelegram: '', showOutOfStock: true } };
  const u = new URL(window.location.href);
  u.searchParams.delete('shop'); u.searchParams.delete('product'); u.searchParams.delete('admin');
  window.history.replaceState({}, '', u.toString());
}
function ref(path) {
  if (!db) throw new Error('Firebase not initialized');
  const t = getTenant();
  if (!t) throw new Error('Tenant not set');
  return db.ref('evso/' + t + (path ? '/' + path : ''));
}

/* ============ UTIL: DEBOUNCE / HAPTIC / TOAST ============ */
function debounce(fn, ms) {
  let timer;
  return function(...args) { clearTimeout(timer); timer = setTimeout(() => fn.apply(this, args), ms); };
}
function haptic(type) {
  if (!navigator.vibrate) return;
  try {
    if (type === 'success') navigator.vibrate(15);
    else if (type === 'delete') navigator.vibrate([10, 30, 10]);
    else if (type === 'add') navigator.vibrate([5, 20, 5]);
    else navigator.vibrate(10);
  } catch (e) {}
}
let _toastEl = null;
function showToast(message, type = 'success') {
  if (!_toastEl) { _toastEl = document.createElement('div'); _toastEl.className = 'toast'; document.body.appendChild(_toastEl); }
  _toastEl.textContent = message; _toastEl.className = 'toast ' + type;
  requestAnimationFrame(() => _toastEl.classList.add('show'));
  clearTimeout(_toastEl._timer); _toastEl._timer = setTimeout(() => _toastEl.classList.remove('show'), 3500);
}

/* ============ РОЛИ ============ */
function normalizeUsers(users) {
  if (!users || typeof users !== 'object') return {};
  const result = {};
  Object.entries(users).forEach(([login, data]) => {
    if (typeof data === 'string') {
      // старый формат: логин → пароль
      result[login] = { password: data, role: 'admin' };
    } else if (data && typeof data === 'object') {
      result[login] = { password: data.password || '', role: data.role === 'worker' ? 'worker' : 'admin' };
    }
  });
  return result;
}
function currentUserRole() {
  const u = state.users[currentUser];
  if (!u) return null;
  return u.role || 'admin';
}
function isAdmin() { return currentUserRole() === 'admin'; }

/* ============ MIGRATION ============ */
function migrateState() {
  if (!state.products || typeof state.products !== 'object') state.products = {};
  if (!state.sales || typeof state.sales !== 'object' || Array.isArray(state.sales)) state.sales = {};
  if (!state.log || typeof state.log !== 'object' || Array.isArray(state.log)) state.log = {};
  state.users = normalizeUsers(state.users);
  if (!state.customBrands || !Array.isArray(state.customBrands)) state.customBrands = [];
  if (!state.settings || typeof state.settings !== 'object') state.settings = { sellerTelegram: '', showOutOfStock: true };
  if (state.settings.showOutOfStock === undefined) state.settings.showOutOfStock = true;
  Object.values(state.products).forEach(p => {
    if (!p.sizes) { p.sizes = {}; return; }
    Object.keys(p.sizes).forEach(size => {
      const s = p.sizes[size]; if (!s) return;
      if (typeof s.wh1 === 'boolean') s.wh1 = s.wh1 ? 1 : 0;
      if (typeof s.wh2 === 'boolean') s.wh2 = s.wh2 ? 1 : 0;
      s.wh1 = qty(s.wh1); s.wh2 = qty(s.wh2);
    });
  });
}

/* ============ ТЕМА ============ */
function applyTheme() {
  const t = localStorage.getItem('evso_theme') || 'light';
  const isDark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.body.classList.toggle('dark', isDark);
  document.querySelectorAll('.theme-toggle').forEach(b => b.textContent = isDark ? '☀️' : '🌙');
}
function toggleTheme() {
  const isDark = document.body.classList.contains('dark');
  localStorage.setItem('evso_theme', isDark ? 'light' : 'dark');
  applyTheme(); haptic();
  if (activeTab === 'settings' && !$('app').hidden) renderSettingsTab();
}
function setTheme(t) { localStorage.setItem('evso_theme', t); applyTheme(); renderSettingsTab(); haptic(); }
applyTheme();

/* ============ БРЕНДЫ / РАЗМЕРЫ ============ */
function getAllBrands() {
  const customs = state.customBrands || [];
  return [...new Set([...DEFAULT_BRANDS, ...customs])].sort();
}
function getAllAvailableSizes() {
  const sizes = new Set();
  Object.values(state.products).forEach(p => {
    Object.keys(p.sizes || {}).forEach(s => {
      if (qty(p.sizes[s].wh1) + qty(p.sizes[s].wh2) > 0) sizes.add(s);
    });
  });
  return [...sizes].sort((a, b) => parseFloat(a) - parseFloat(b));
}

/* ============ ЛОГ ДЕЙСТВИЙ ============ */
const LOG_ICONS = {
  'sale': '💰', 'product_add': '➕', 'product_edit': '✏️', 'product_delete': '🗑',
  'sales_clear': '🧹', 'user_add': '👤', 'user_delete': '🚫', 'pass_change': '🔑',
  'wh_rename': '🏪', 'backup_restore': '♻️', 'settings_change': '⚙️', 'log_clear': '📜',
  'slug_change': '🏷'
};
function logAction(action, details) {
  if (!currentUser) return;
  const id = uid('l');
  const entry = { id, date: new Date().toISOString(), user: currentUser, action, details: details || '' };
  if (!state.log) state.log = {};
  state.log[id] = entry;
  pruneLocalLog();
  saveLocal();
  if (useFirebase) { try { ref('log/' + id).set(entry).catch(e => console.error(e)); } catch (e) {} }
  if (activeTab === 'log') scheduleRender();
}
function pruneLocalLog() {
  const keys = Object.keys(state.log);
  if (keys.length <= LOG_LIMIT_LOCAL) return;
  keys.sort((a, b) => new Date(state.log[a].date) - new Date(state.log[b].date));
  keys.slice(0, keys.length - LOG_LIMIT_LOCAL).forEach(k => { delete state.log[k]; });
}

/* ============ BUYER ENTRY ============ */
async function buyerEnter() {
  const slug = ($('buyerSlug').value || '').trim().toLowerCase();
  if (!slug) { $('buyerErr').textContent = 'Введите название магазина'; return; }
  if (!/^[a-z0-9_-]{2,30}$/.test(slug)) { $('buyerErr').textContent = 'Только латиница, цифры, _ и -'; return; }
  $('buyerErr').textContent = 'Проверяем...';
  initFirebase();
  if (!db) { $('buyerErr').textContent = 'Нет соединения с сервером'; return; }
  try {
    const snap = await db.ref('evso/' + slug + '/users').once('value');
    if (!snap.exists()) { $('buyerErr').textContent = 'Магазин не найден'; return; }
    setTenant(slug);
    haptic('success');
    // принудительно витрина
    const u = new URL(window.location.href);
    u.searchParams.set('shop', slug);
    window.history.replaceState({}, '', u.toString());
    openShop();
  } catch (e) { console.error(e); $('buyerErr').textContent = 'Ошибка соединения'; }
}

/* ============ LOGIN ============ */
async function doLogin() {
  const u = ($('loginUser').value || '').trim();
  const p = $('loginPass').value;
  if (!u || !p) { $('loginErr').textContent = 'Введите логин и пароль'; return; }
  $('loginErr').textContent = 'Проверяем...';
  initFirebase();
  if (!db) { $('loginErr').textContent = 'Нет соединения с сервером'; return; }

  // Если tenant ещё не выбран — пробуем найти магазин по логину
  let tenant = getTenant();
  if (!tenant) {
    // Поиск магазина по логину (перебираем всех)
    try {
      const allSnap = await db.ref('evso').once('value');
      const all = allSnap.val() || {};
      for (const t of Object.keys(all)) {
        const users = all[t] && all[t].users;
        if (users && users[u]) {
          tenant = t;
          break;
        }
      }
      if (!tenant) { $('loginErr').textContent = 'Магазин с таким логином не найден'; return; }
      setTenant(tenant);
    } catch (e) { console.error(e); $('loginErr').textContent = 'Ошибка соединения'; return; }
  }

  try {
    const snap = await ref('users').once('value');
    const usersRaw = snap.val() || {};
    const users = normalizeUsers(usersRaw);
    if (!users[u] || users[u].password !== p) { $('loginErr').textContent = 'Неверный логин или пароль'; haptic('delete'); return; }
    state.users = users;
    saveLocal();
    currentUser = u;
    localStorage.setItem(USER_KEY, u);
    haptic('success');
    $('loginErr').textContent = '';
    $('loginPass').value = '';
    showApp();
  } catch (e) { console.error(e); $('loginErr').textContent = 'Ошибка проверки'; }
}

/* ============ REGISTER ============ */
async function doRegister() {
  const slug = ($('regSlug').value || '').trim().toLowerCase();
  const login = ($('regLogin').value || '').trim();
  const pass1 = $('regPass1').value;
  const pass2 = $('regPass2').value;
  const key = ($('regKey').value || '').trim();

  if (!slug || !login || !pass1 || !pass2 || !key) { $('regErr').textContent = 'Заполните все поля'; return; }
  if (!/^[a-z0-9_-]{2,30}$/.test(slug)) { $('regErr').textContent = 'Slug: только латиница, цифры, _ и -'; return; }
  if (!/^[a-zA-Zа-яА-Я0-9_\- ]{2,30}$/.test(login)) { $('regErr').textContent = 'Логин: 2-30 символов'; return; }
  if (pass1.length < 4) { $('regErr').textContent = 'Пароль минимум 4 символа'; return; }
  if (pass1 !== pass2) { $('regErr').textContent = 'Пароли не совпадают'; return; }
  if (key !== ADMIN_KEY) { $('regErr').textContent = 'Неверный ключ доступа'; haptic('delete'); return; }

  $('regErr').textContent = 'Создаём магазин...';
  initFirebase();
  if (!db) { $('regErr').textContent = 'Нет соединения с сервером'; return; }

  try {
    const check = await db.ref('evso/' + slug + '/users').once('value');
    if (check.exists()) { $('regErr').textContent = 'Магазин с таким названием уже существует'; return; }
    const initial = {
      warehouses: { wh1:{name:'Точка 1'}, wh2:{name:'Точка 2'} },
      products: {}, sales: {}, log: {},
      users: { [login]: { password: pass1, role: 'admin' } },
      customBrands: [],
      settings: { sellerTelegram: '', showOutOfStock: true }
    };
    await db.ref('evso/' + slug).set(initial);
    setTenant(slug);
    state = JSON.parse(JSON.stringify(initial));
    migrateState(); saveLocal();
    localStorage.setItem(USER_KEY, login);
    currentUser = login;
    haptic('add');
    $('regErr').textContent = '';
    $('regSlug').value = ''; $('regLogin').value = ''; $('regPass1').value = ''; $('regPass2').value = ''; $('regKey').value = '';
    showApp();
    showToast('Магазин «' + slug + '» создан!');
    logAction('settings_change', 'Создан магазин «' + slug + '»');
  } catch (e) { console.error(e); $('regErr').textContent = 'Ошибка: ' + (e.message || 'неизвестная'); }
}

/* ============ INIT ============ */
function initAuth() {
  currentUser = localStorage.getItem(USER_KEY) || '';
  loadLocal();

  initFirebase();

  const urlShop = getTenantFromUrl();
  const adminParam = new URLSearchParams(window.location.search).get('admin');

  // 1) Прямая ссылка на витрину (для покупателя)
  if (urlShop && !adminParam) {
    setTenant(urlShop);
    openShop();
    return;
  }

  // 2) Прямая ссылка на вход продавца
  if (urlShop && adminParam) {
    setTenant(urlShop);
    if (!db) { goSeller(); return; }
    ref('users').once('value').then(snap => {
      if (!snap.exists()) { showToast('Магазин не найден', 'error'); goWelcome(); return; }
      state.users = normalizeUsers(snap.val());
      saveLocal();
      if (currentUser && state.users[currentUser]) { showApp(); return; }
      goLogin();
    }).catch(() => goWelcome());
    return;
  }

  // 3) Есть сохранённый тенант и логин — пробуем сразу открыть админку
  const savedTenant = localStorage.getItem(TENANT_KEY) || '';
  if (savedTenant && currentUser && db) {
    TENANT = savedTenant;
    db.ref('evso/' + savedTenant + '/users').once('value').then(snap => {
      if (!snap.exists()) { clearTenant(); goWelcome(); return; }
      state.users = normalizeUsers(snap.val());
      saveLocal();
      if (state.users[currentUser]) {
        // Восстанавливаем URL
        const u = new URL(window.location.href);
        u.searchParams.set('shop', savedTenant);
        window.history.replaceState({}, '', u.toString());
        showApp();
        return;
      }
      goWelcome();
    }).catch(() => goWelcome());
    return;
  }

  // 4) Дефолт — welcome
  goWelcome();
}

function logout() {
  if (!confirm('Выйти из аккаунта?')) return;
  flushSave();
  localStorage.removeItem(USER_KEY);
  currentUser = '';
  syncOnline = false; syncError = false; useFirebase = false;
  updateSyncBar();
  goWelcome();
}

/* ============ SHOP ============ */
let _shopBound = false, _shopRealtime = false, _shopRenderTimer = null;

function openShop() {
  hideAllScreens();
  $('shopScreen').hidden = false;

  if (!_shopBound) { bindShopFilters(); _shopBound = true; }
  if (!_shopRealtime) { setupShopRealtime(); _shopRealtime = true; }

  const productId = new URLSearchParams(window.location.search).get('product');
  if (productId) setTimeout(() => { if (state.products[productId]) openShopProductView(productId); }, 600);
}

function bindShopFilters() {
  const onSearch = debounce(e => { shopFilters.search = e.target.value; renderShopGrid(); }, SEARCH_DELAY);
  $('shopSearch')?.addEventListener('input', onSearch);
  $('shopBrand')?.addEventListener('change', e => { shopFilters.brand = e.target.value; renderShopGrid(); });
  $('shopSize')?.addEventListener('change', e => { shopFilters.size = e.target.value; renderShopGrid(); });
  $('shopGender')?.addEventListener('change', e => { shopFilters.gender = e.target.value; renderShopGrid(); });
  $('shopSeason')?.addEventListener('change', e => { shopFilters.season = e.target.value; renderShopGrid(); });
  $('shopSort')?.addEventListener('change', e => { shopFilters.sort = e.target.value; renderShopGrid(); });
}

function setupShopRealtime() {
  if (!initFirebase()) { renderShop(); return; }
  const err = e => { console.error('Shop sync:', e); syncError = true; updateSyncBar(); };
  db.ref('.info/connected').on('value', s => { syncOnline = s.val() === true; updateSyncBar(); });
  const onProd = () => scheduleShopRender();
  try {
    ref('products').on('child_added', snap => { state.products[snap.key] = snap.val(); onProd(); }, err);
    ref('products').on('child_changed', snap => { state.products[snap.key] = snap.val(); onProd(); }, err);
    ref('products').on('child_removed', snap => { delete state.products[snap.key]; onProd(); }, err);
    ref('warehouses').on('value', snap => { const v = snap.val(); if (v) { state.warehouses = v; onProd(); } }, err);
    ref('settings').on('value', snap => { const v = snap.val(); if (v) { state.settings = v; onProd(); } }, err);
  } catch (e) { console.error(e); }
  renderShop();
}

function scheduleShopRender() {
  if (_shopRenderTimer) return;
  _shopRenderTimer = setTimeout(() => { _shopRenderTimer = null; renderShop(); }, RENDER_DELAY);
}

function renderShop() {
  const entries = Object.entries(state.products);
  const totalQty = entries.reduce((a, [, p]) => a + getTotalQty(p), 0);
  const title = $('shopTitle');
  if (title) title.textContent = getTenant() || 'Каталог';
  const sub = $('shopSubtitle');
  if (sub) sub.textContent = entries.length ? `${entries.length} ${plural(entries.length,'модель','модели','моделей')} · ${totalQty} ${plural(totalQty,'пара','пары','пар')} в наличии` : 'Пока пусто';

  const brands = [...new Set(entries.map(([, p]) => p.brand).filter(Boolean))].sort();
  const brandSel = $('shopBrand');
  if (brandSel) {
    const cv = shopFilters.brand;
    brandSel.innerHTML = '<option value="">Все бренды</option>' + brands.map(b => `<option value="${esc(b)}"${cv === b ? ' selected' : ''}>${esc(b)}</option>`).join('');
  }
  const sizes = getAllAvailableSizes();
  const sizeSel = $('shopSize');
  if (sizeSel) {
    const cv = shopFilters.size;
    sizeSel.innerHTML = '<option value="">Размер</option>' + sizes.map(s => `<option value="${esc(s)}"${cv === s ? ' selected' : ''}>${esc(s)}</option>`).join('');
  }
  renderShopGrid();
}

function renderShopGrid() {
  const grid = $('shopGrid'); if (!grid) return;
  const showOut = state.settings?.showOutOfStock !== false;
  let entries = Object.entries(state.products).filter(([, p]) => showOut || getTotalQty(p) > 0);
  const q = shopFilters.search.toLowerCase().trim();
  entries = entries.filter(([, p]) => {
    if (q && !((p.name||'').toLowerCase().includes(q) || (p.brand||'').toLowerCase().includes(q))) return false;
    if (shopFilters.brand && p.brand !== shopFilters.brand) return false;
    if (shopFilters.gender && p.gender !== shopFilters.gender) return false;
    if (shopFilters.season && p.season !== shopFilters.season) return false;
    if (shopFilters.size) {
      const sz = p.sizes?.[shopFilters.size];
      if (!sz || (qty(sz.wh1) + qty(sz.wh2)) === 0) return false;
    }
    return true;
  });
  if (shopFilters.sort === 'price_asc') entries.sort((a, b) => (a[1].price||0) - (b[1].price||0));
  else if (shopFilters.sort === 'price_desc') entries.sort((a, b) => (b[1].price||0) - (a[1].price||0));
  else if (shopFilters.sort === 'name') entries.sort((a, b) => (a[1].name||'').localeCompare(b[1].name||''));
  if (!entries.length) { grid.innerHTML = '<div class="empty" style="grid-column:1/-1">Товаров не найдено</div>'; return; }
  grid.innerHTML = entries.map(([id, p]) => renderShopProductCard(id, p)).join('');
}

function renderShopProductCard(id, p) {
  const total = getTotalQty(p);
  const attrs = [p.gender, p.season].filter(Boolean).join(' · ');
  return `<div class="product-card" onclick="openShopProductView('${id}')">
    <div class="photo">
      ${p.photo ? `<img src="${p.photo}" alt="" loading="lazy">` : '<div class="photo-placeholder">👟</div>'}
      ${total === 0 ? '<div class="no-stock-overlay">Нет в наличии</div>' : ''}
    </div>
    <div class="info">
      ${p.brand ? `<div class="brand">${esc(p.brand)}</div>` : ''}
      <div class="name">${esc(p.name)}</div>
      ${attrs ? `<div class="meta"><span>${esc(attrs)}</span></div>` : ''}
      ${p.price ? `<div class="shop-price">${fmt(p.price)} ₽</div>` : ''}
    </div>
  </div>`;
}

function openShopProductView(productId) {
  const p = state.products[productId]; if (!p) { showToast('Товар не найден', 'error'); return; }
  const sizes = Object.keys(p.sizes || {}).sort((a, b) => parseFloat(a) - parseFloat(b));
  const totalQty = getTotalQty(p);
  const attrs = [p.gender, p.season].filter(Boolean).join(' · ');
  const sizesHtml = sizes.map(size => {
    const total = qty(p.sizes[size].wh1) + qty(p.sizes[size].wh2);
    return `<div class="view-size-row ${total === 0 ? 'out' : ''}"><span class="vsr-size">${esc(size)}</span><span style="font-weight:800;font-variant-numeric:tabular-nums">${total}</span></div>`;
  }).join('');
  const tgUser = (state.settings?.sellerTelegram || '').replace(/^@/, '').trim();
  let tgUrl = '';
  if (tgUser) {
    const msg = encodeURIComponent(`Здравствуйте! Интересует: ${p.brand || ''} ${p.name}${p.price ? ' — ' + p.price + ' ₽' : ''}`);
    tgUrl = `https://t.me/${tgUser}?text=${msg}`;
  }
  let actionHtml;
  if (totalQty > 0) {
    actionHtml = tgUrl
      ? `<a href="${tgUrl}" target="_blank" rel="noopener" class="btn primary">💬 Написать продавцу</a>`
      : `<button class="btn primary" onclick="showToast('Продавец не указал Telegram','error')">💬 Написать продавцу</button>`;
  } else {
    actionHtml = `<button class="btn" disabled style="opacity:.5;cursor:not-allowed">Нет в наличии</button>`;
  }
  openModal(`
    <div class="view-photo">${p.photo ? `<img src="${p.photo}" alt="">` : '<div class="photo-placeholder">👟</div>'}</div>
    ${p.brand ? `<div style="text-transform:uppercase;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.6px">${esc(p.brand)}</div>` : ''}
    <h3 style="margin:4px 0 6px">${esc(p.name)}</h3>
    ${attrs ? `<div class="muted" style="font-size:13px;margin-bottom:8px">${esc(attrs)}</div>` : ''}
    ${p.price ? `<div style="font-size:24px;font-weight:800;margin-bottom:4px">${fmt(p.price)} ₽</div>` : ''}
    ${totalQty > 0 ? `<div style="font-size:12px;color:var(--success);font-weight:600;margin-bottom:12px">● В наличии (${totalQty} ${plural(totalQty,'пара','пары','пар')})</div>` : `<div style="font-size:12px;color:var(--muted);font-weight:600;margin-bottom:12px">○ Нет в наличии</div>`}
    ${sizes.length ? `<div style="margin:12px 0"><div style="font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:700;text-transform:uppercase;letter-spacing:.4px">Размеры</div><div class="view-sizes-grid">${sizesHtml}</div></div>` : ''}
    <div class="shop-modal-actions">
      <button class="btn icon" onclick="shareProduct('${productId}')" title="Поделиться">🔗</button>
      ${actionHtml}
    </div>
    <div style="margin-top:10px"><button class="btn" style="width:100%" onclick="closeModal()">Закрыть</button></div>
  `);
}

/* ============ SHARE ============ */
function buildShopUrl(productId) {
  const params = new URLSearchParams();
  params.set('shop', getTenant() || '');
  if (productId) params.set('product', productId);
  return window.location.origin + window.location.pathname + '?' + params.toString();
}
async function shareShop() {
  const url = buildShopUrl();
  const title = 'evso — каталог обуви';
  haptic();
  if (navigator.share) { try { await navigator.share({ title, text: title, url }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(url); showToast('Ссылка скопирована'); }
  catch (e) { prompt('Скопируйте ссылку:', url); }
}
async function shareProduct(productId) {
  const p = state.products[productId]; if (!p) return;
  const url = buildShopUrl(productId);
  const title = `${p.brand ? p.brand + ' ' : ''}${p.name}`;
  const text = p.price ? `${title} — ${fmt(p.price)} ₽` : title;
  haptic();
  if (navigator.share) { try { await navigator.share({ title, text, url }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(url); showToast('Ссылка скопирована'); }
  catch (e) { prompt('Скопируйте ссылку:', url); }
}

/* ============ FIREBASE ============ */
const getFbUrl = () => DEFAULT_FB_URL || '';
function initFirebase() {
  const url = getFbUrl();
  if (!url || typeof firebase === 'undefined') return false;
  try {
    if (!firebase.apps.length) firebase.initializeApp({ databaseURL: url });
    db = firebase.database(); return true;
  } catch (e) { console.error('Firebase init error:', e); return false; }
}

function showApp() {
  hideAllScreens();

    badge.className = 'role-badge ' + role;

  }
  activeTab = 'menu';
  document.querySelectorAll('.main-nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === 'menu'));
  ['menu','products','sales','stats','log','settings'].forEach(t => { const sec = $('tab-' + t); if (sec) sec.hidden = t !== 'menu'; });
  window.scrollTo(0, 0); render(); setupRealtime(); checkAutoBackup();
  setTimeout(() => {
    if (isStandalone || localStorage.getItem('evso_banner_dismissed') || localStorage.getItem('evso_installed')) return;
    if (isIOS) showInstallBanner('ios'); else if (deferredInstallPrompt) showInstallBanner('android');

/* ============ REALTIME ============ */
async function setupRealtime() {
  useFirebase = initFirebase();
  if (!useFirebase) { updateSync(false); return; }
  if (!getTenant()) { updateSync(false); return; }

  db.ref('.info/connected').on('value', s => { syncOnline = s.val() === true; updateSync(syncOnline); });

  try {
    const snap = await ref('').once('value'); const data = snap.val();
    if (!data) await ref('').set({
      warehouses: state.warehouses, products: state.products, sales: state.sales,
      users: state.users, customBrands: state.customBrands, settings: state.settings
    });
    else {
      if (!data.warehouses) ref('warehouses').set(state.warehouses);
      if (!data.users) ref('users').set(state.users);
      if (!data.customBrands) ref('customBrands').set(state.customBrands || []);
      if (!data.settings) ref('settings').set(state.settings);
    }
  } catch (e) { console.error(e); updateSync(false, true); return; }

  firebaseReady = true;
  const err = e => { console.error(e); updateSync(false, true); };

  ref('warehouses').on('value', snap => { const v = snap.val(); if (v) { state.warehouses = v; saveLocal(); scheduleRender(); } }, err);
  ref('users').on('value', snap => {
    const v = snap.val();
    if (v) {
      state.users = normalizeUsers(v);
      saveLocal();
      // Если наш пользователь удалён — выходим
      if (currentUser && !state.users[currentUser]) {
        showToast('Ваш аккаунт удалён', 'error');
        logout();
        return;
      }
      scheduleRender();
    }
  }, err);
  ref('customBrands').on('value', snap => { const v = snap.val(); if (v) { state.customBrands = v; saveLocal(); scheduleRender(); } }, err);
  ref('settings').on('value', snap => { const v = snap.val(); if (v) { state.settings = v; saveLocal(); scheduleRender(); } }, err);

  ref('products').on('child_added', snap => { state.products[snap.key] = snap.val(); saveLocal(); scheduleRender(); }, err);
  ref('products').on('child_changed', snap => { state.products[snap.key] = snap.val(); saveLocal(); scheduleRender(); }, err);
  ref('products').on('child_removed', snap => { delete state.products[snap.key]; saveLocal(); scheduleRender(); }, err);
  ref('sales').on('child_added', snap => { const v = snap.val(); if (v) { state.sales[snap.key] = v; saveLocal(); scheduleRender(); } }, err);
  ref('sales').on('child_changed', snap => { const v = snap.val(); if (v) { state.sales[snap.key] = v; saveLocal(); scheduleRender(); } }, err);
  ref('sales').on('child_removed', snap => { delete state.sales[snap.key]; saveLocal(); scheduleRender(); }, err);
  ref('log').on('child_added', snap => {
    const v = snap.val(); if (!v) return;
    if (!state.log) state.log = {};
    if (state.log[snap.key]) return;
    state.log[snap.key] = v;
    pruneLocalLog(); saveLocal();
    if (activeTab === 'log') scheduleRender();

  updateSync(true);
}

/* ============ STORAGE ============ */
function loadLocal() {
  try {
    const raw = localStorage.getItem(STATE_KEY); if (!raw) return;
    const d = JSON.parse(raw);
    if (d && d.products && d.warehouses) {
      state = d;
      if (!state.sales || typeof state.sales !== 'object') state.sales = {};
      if (!state.log || typeof state.log !== 'object') state.log = {};
      try {
        const photosRaw = localStorage.getItem(PHOTOS_KEY);
        if (photosRaw) {
          const photos = JSON.parse(photosRaw);
          Object.entries(photos).forEach(([id, photo]) => {
            if (state.products[id]) state.products[id].photo = photo;
          });
        }
      } catch (e) { console.warn('Photos load error', e); }
      migrateState();
    }
  } catch (e) { console.error(e); }
}
let _saveTimer = null, _saveDirty = false;
function saveLocal() {
  _saveDirty = true;
  if (_saveTimer) return;
  _saveTimer = setTimeout(() => { _saveTimer = null; doSave(); }, SAVE_DELAY);
}
function doSave() {
  if (!_saveDirty) return;
  _saveDirty = false;
  try {
    const photos = {};
    const stateCopy = { ...state, products: {} };
    Object.entries(state.products).forEach(([id, p]) => {
      if (p.photo) photos[id] = p.photo;
      const pCopy = { ...p };
      delete pCopy.photo;
      stateCopy.products[id] = pCopy;
    });
    localStorage.setItem(STATE_KEY, JSON.stringify(stateCopy));
    if (Object.keys(photos).length) localStorage.setItem(PHOTOS_KEY, JSON.stringify(photos));
    else localStorage.removeItem(PHOTOS_KEY);
  } catch (e) {
    console.error('Save error:', e);
    try {
      const stateNoPhoto = JSON.parse(JSON.stringify(state));
      Object.values(stateNoPhoto.products).forEach(p => delete p.photo);
      localStorage.setItem(STATE_KEY, JSON.stringify(stateNoPhoto));
    } catch (e2) { console.error('Fallback save error:', e2); }
  }
}
function flushSave() {
  if (_saveTimer) { clearTimeout(_saveTimer); _saveTimer = null; }
  doSave();
}
window.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSave(); });
window.addEventListener('beforeunload', flushSave);

/* ============ BACKUP ============ */
function checkAutoBackup() {
  const today = new Date().toISOString().slice(0, 10);
  const key = 'evso_last_backup_' + (getTenant() || 'none');
  if (localStorage.getItem(key) !== today) {
    try {
      const backupState = JSON.parse(JSON.stringify(state));
      Object.values(backupState.products).forEach(p => delete p.photo);
      localStorage.setItem('evso_backup_' + (getTenant() || 'none') + '_' + today, JSON.stringify(backupState));
      localStorage.setItem(key, today);
      const prefix = 'evso_backup_' + (getTenant() || 'none') + '_';
      const keys = Object.keys(localStorage).filter(k => k.startsWith(prefix)).sort();
      if (keys.length > 3) keys.slice(0, keys.length - 3).forEach(k => localStorage.removeItem(k));
    } catch(e) { console.warn('Backup error', e); }
  }
}
function downloadBackup() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `evso-${getTenant() || 'backup'}-${new Date().toISOString().slice(0,10)}.json`; a.click();
  showToast('Копия скачана');
}
function restoreBackup(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.products || !data.users) throw new Error('Неверный формат');
      if (!confirm('Восстановить данные? Текущие данные будут заменены!')) return;
      state = data; migrateState(); saveLocal();
      if (useFirebase) { try { ref('').set(state); } catch (e2) {} }
      logAction('backup_restore', `Восстановлен из файла (${file.name})`);
      haptic('add');
      render(); showToast('Данные восстановлены');
    } catch (err) { alert('Ошибка: ' + err.message); }
  };
  reader.readAsText(file);
}

function getFilteredProducts() {
  const q = filters.search.toLowerCase();
  return Object.entries(state.products).filter(([id, p]) => {
    if (q && !((p.name||'').toLowerCase().includes(q) || (p.brand||'').toLowerCase().includes(q))) return false;
    if (filters.brand && p.brand !== filters.brand) return false;
    if (filters.gender && p.gender !== filters.gender) return false;
    if (filters.season && p.season !== filters.season) return false;
    if (filters.size) {
      const sz = p.sizes?.[filters.size];
      if (!sz || (qty(sz.wh1) + qty(sz.wh2)) === 0) return false;
    }
    return true;
  }).sort((a, b) => {
    const pa = a[1], pb = b[1];
    if ((pa.brand||'') !== (pb.brand||'')) return (pa.brand||'').localeCompare(pb.brand||'');
    return (pa.name||'').localeCompare(pb.name||'');
  });
}
function renderProductGrid() {
  const grid = $('productGrid'); if (!grid) return; const list = getFilteredProducts();
  if (!list.length) {

    return;

  grid.innerHTML = list.map(([id, p]) => renderProductCard(id, p)).join('');
}

function resizeImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const maxDim = PHOTO_MAX_SIZE;
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) { const r = Math.min(maxDim/w, maxDim/h); w = Math.round(w*r); h = Math.round(h*r); }
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', PHOTO_QUALITY));
      };
      img.onerror = reject; img.src = e.target.result;
    };
    reader.onerror = reject; reader.readAsDataURL(file);
  });
}

/* ============ SALE ============ */
function openSaleModal(productId) {
  const p = state.products[productId]; if (!p) return;
  const items = [];
  Object.keys(p.sizes || {}).forEach(size => {
    const q1 = qty(p.sizes[size].wh1), q2 = qty(p.sizes[size].wh2);
    if (q1 > 0) items.push({ size, wh: 'wh1', whName: state.warehouses.wh1.name, qty: q1 });
    if (q2 > 0) items.push({ size, wh: 'wh2', whName: state.warehouses.wh2.name, qty: q2 });
  });
  if (!items.length) { showToast('Нет доступных размеров', 'error'); return; }
  const opts = items.map((it, i) => `<option value="${i}">Размер ${esc(it.size)} — ${esc(it.whName)} (${it.qty} шт)</option>`).join('');
  const minHint = p.minPrice != null ? `<div class="hint-box">Мин. цена: <b>${fmt(p.minPrice)} ₽</b>${p.price > p.minPrice ? ` · макс. скидка ${fmt(p.price - p.minPrice)} ₽` : ''}</div>` : '';

  openModal(`
    <h3>Продажа: ${esc(p.name)}</h3>${minHint}
    <form id="saleForm">
      <label>Что продаём<select name="item" required>${opts}</select></label>
      <label>Цена продажи, ₽<input name="price" type="number" inputmode="decimal" min="0" step="any" value="${p.price || ''}" required autofocus></label>
      <div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Отмена</button><button type="submit" class="btn primary">Продать</button></div>
    </form>`);

  $('saleForm').onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target); const it = items[+f.get('item')]; if (!it) return;
    const price = parseFloat(f.get('price')) || 0; const prod = state.products[productId];
    if (!prod || !prod.sizes[it.size] || qty(prod.sizes[it.size][it.wh]) < 1) { showToast('Товар продан', 'error'); closeModal(); render(); return; }
    if (prod.minPrice != null && price < prod.minPrice) { if (!confirm(`Цена ${fmt(price)} ₽ ниже минимальной. Всё равно продать?`)) return; }

    prod.sizes[it.size][it.wh] = Math.max(0, qty(prod.sizes[it.size][it.wh]) - 1);
    const saleId = uid('s');
    const sale = { id: saleId, productId, productName: prod.name, brand: prod.brand || '', size: it.size, wh: it.wh, whName: state.warehouses[it.wh].name, price, date: new Date().toISOString(), user: currentUser };
    state.sales[saleId] = sale; saveLocal();
    logAction('sale', `Продано: ${prod.brand || ''} ${prod.name}, размер ${it.size}, ${state.warehouses[it.wh].name} — ${fmt(price)} ₽`);
    haptic('success'); closeModal(); render(); showToast(`✓ Продано: ${prod.name}, ${it.size} р., ${fmt(price)} ₽`);

    if (useFirebase && firebaseReady) {
      try { await Promise.all([ref('products/' + productId).set(prod), ref('sales/' + saleId).set(sale)]); }
      catch (err) { showToast('⚠️ Ошибка сохранения на сервер', 'error'); updateSync(false, true); }
    }
  };
}

/* ============ STATS TAB ============ */
function renderStatsTab() {
  const sales = Object.values(state.sales || {}).filter(s => s && s.date);
  const allUsers = [...new Set(sales.map(s => s.user).filter(Boolean))].sort();
  const cutoff = new Date(); cutoff.setHours(0,0,0,0); cutoff.setDate(cutoff.getDate() - (statsPeriod - 1));
  const salesInPeriod = sales.filter(s => new Date(s.date) >= cutoff);
  const periodTotal = salesInPeriod.reduce((a, s) => a + (+s.price || 0), 0);
  const daysMap = {}; const today = new Date(); today.setHours(0,0,0,0);
  for (let i = statsPeriod - 1; i >= 0; i--) { const d = new Date(today); d.setDate(d.getDate() - i); daysMap[dayKey(d)] = { key: dayKey(d), date: d, total: 0, count: 0, byUser: {}, isToday: i === 0 }; }
  salesInPeriod.forEach(s => { const d = new Date(s.date); d.setHours(0,0,0,0); const day = daysMap[dayKey(d)]; if (!day) return; day.total += +s.price || 0; day.count++; const u = s.user || '—'; if (!day.byUser[u]) day.byUser[u] = { total: 0, count: 0 }; day.byUser[u].total += +s.price || 0; day.byUser[u].count++; });
  const days = Object.values(daysMap).sort((a, b) => a.date - b.date);
  const maxTotal = Math.max(...days.map(d => d.total), 1);
  const barsHtml = days.map(d => { const h = d.total > 0 ? Math.max(2, (d.total / maxTotal) * 100) : 0; return `<div class="chart-bar-wrap ${d.isToday ? 'today' : ''}" onclick="openDayDetails('${d.key}')" title="${d.date.toLocaleDateString('ru-RU')}: ${fmt(d.total)} ₽ · ${d.count} пар"><div class="chart-bar-inner"><div class="chart-bar ${d.total === 0 ? 'zero' : ''}" style="height:${h}%"></div></div><div class="chart-label">${d.date.getDate()}</div></div>`; }).join('');
  const userHeaders = allUsers.map(u => `<th class="num">${esc(u)}</th>`).join('');
  const rowsHtml = days.slice().reverse().map(d => {
    const userCells = allUsers.map(u => { const info = d.byUser[u] || { total: 0, count: 0 }; if (!info.count) return '<td class="num muted">—</td>'; return `<td class="num">${fmt(info.total)} ₽<br><span class="muted" style="font-size:11px;font-weight:400">${info.count} пар</span></td>`; }).join('');
    return `<tr onclick="openDayDetails('${d.key}')" style="cursor:pointer" class="${d.count === 0 ? 'empty-day' : ''}"><td>${d.date.toLocaleDateString('ru-RU', { day:'2-digit', month:'2-digit', weekday:'short' })}</td><td class="num">${d.count || '—'}</td><td class="num"><b>${d.total ? fmt(d.total) + ' ₽' : '—'}</b></td>${userCells}</tr>`;
  }).join('');
  const userStatsHtml = allUsers.map(u => { const us = salesInPeriod.filter(s => s.user === u); const ut = us.reduce((a, s) => a + (+s.price || 0), 0); return `<div class="stat"><div class="k">${esc(u)}</div><div class="v">${fmt(ut)} ₽</div><div style="font-size:11.5px;color:var(--muted);margin-top:2px">${us.length} пар</div></div>`; }).join('');
  $('tab-stats').innerHTML = `
    <div class="period-tabs">${[7,14,30,90].map(p => `<button class="${statsPeriod === p ? 'active' : ''}" onclick="setStatsPeriod(${p})">${p} дн.</button>`).join('')}</div>
    <div class="stats"><div class="stat"><div class="k">Выручка за ${statsPeriod} дн.</div><div class="v">${fmt(periodTotal)} ₽</div></div><div class="stat"><div class="k">Продано пар</div><div class="v">${salesInPeriod.length}</div></div>${userStatsHtml}</div>
    <div class="chart-wrap"><div class="chart-bars">${barsHtml}</div></div>
    <div class="sales-wrap"><div class="table-scroll"><table class="sales-table"><thead><tr><th>Дата</th><th class="num">Пар</th><th class="num">Выручка</th>${userHeaders}</tr></thead><tbody>${rowsHtml}</tbody></table></div></div>`;
}
function setStatsPeriod(p) { statsPeriod = p; renderStatsTab(); }

function openDayDetails(key) {
  const sales = Object.values(state.sales || {}).filter(s => { if (!s || !s.date) return false; const d = new Date(s.date); d.setHours(0,0,0,0); return dayKey(d) === key; });
  if (!sales.length) { showToast('В этот день продаж не было', 'error'); return; }
  sales.sort((a, b) => new Date(a.date) - new Date(b.date));
  const total = sales.reduce((a, s) => a + (+s.price || 0), 0);
  const dateStr = new Date(sales[0].date).toLocaleDateString('ru-RU', { weekday:'long', day:'2-digit', month:'long', year:'numeric' });
  const byUser = {};
  sales.forEach(s => { const u = s.user || '—'; if (!byUser[u]) byUser[u] = { sales: [], total: 0 }; byUser[u].sales.push(s); byUser[u].total += +s.price || 0; });
  const userHtml = Object.entries(byUser).map(([u, data]) => `<div class="user-section"><div class="user-header"><span>${esc(u)}</span><span>${data.sales.length} пар · <b>${fmt(data.total)} ₽</b></span></div><div class="user-sales">${data.sales.map(s => `<div class="sale-item"><div><div class="sale-name">${esc(s.brand || '')} ${esc(s.productName || '')}</div><div class="sale-meta">Разм. ${esc(s.size)} · ${esc(s.whName || '')} · ${new Date(s.date).toLocaleTimeString('ru-RU', {hour:'2-digit',minute:'2-digit'})}</div></div><div class="sale-price">${fmt(s.price)} ₽</div></div>`).join('')}</div></div>`).join('');
  openModal(`<h3 style="text-transform:capitalize">${dateStr}</h3><div class="day-summary"><span>Всего: <b>${sales.length} пар</b></span><span><b>${fmt(total)} ₽</b></span></div>${userHtml}<div class="modal-actions"><button class="btn" onclick="closeModal()">Закрыть</button></div>`, true);
}

/* ============ EXPORT ============ */
function exportProducts() {
  const products = Object.values(state.products).sort((a, b) => { if ((a.brand||'') !== (b.brand||'')) return (a.brand||'').localeCompare(b.brand||''); return (a.name||'').localeCompare(b.name||''); });
  if (!products.length) { showToast('Нет товаров', 'error'); return; }
  const wh1 = state.warehouses.wh1.name, wh2 = state.warehouses.wh2.name;
  const rows = [['Бренд','Модель','Пол','Сезон','Цена, ₽','Мин. цена, ₽', `${wh1} (разм:кол)`, `${wh2} (разм:кол)`, 'Всего пар']];
  products.forEach(p => {
    const sizes = Object.keys(p.sizes || {}).sort((a, b) => parseFloat(a) - parseFloat(b));
    const t1 = sizes.filter(s => qty(p.sizes[s].wh1) > 0).map(s => `${s}:${qty(p.sizes[s].wh1)}`).join(', ');
    const t2 = sizes.filter(s => qty(p.sizes[s].wh2) > 0).map(s => `${s}:${qty(p.sizes[s].wh2)}`).join(', ');
    rows.push([p.brand || '', p.name || '', p.gender || '', p.season || '', p.price || 0, p.minPrice ?? '', t1, t2, getTotalQty(p)]);
  });
  doExport(rows, 'Товары', 'evso-tovary');
}
function exportSales() {
  const sales = Object.values(state.sales || {}).filter(s => s && s.date).sort((a, b) => new Date(b.date) - new Date(a.date));
  if (!sales.length) { showToast('Нет продаж', 'error'); return; }
  const rows = [['Дата','Продавец','Бренд','Модель','Размер','Точка','Цена, ₽']];
  sales.forEach(s => rows.push([new Date(s.date).toLocaleString('ru-RU'), s.user || '', s.brand || '', s.productName || '', s.size, s.whName || '', s.price || 0]));
  doExport(rows, 'Продажи', 'evso-prodazhi');
}
function doExport(rows, sheetName, filename) {
  const today = new Date().toISOString().slice(0, 10);
  if (typeof XLSX === 'undefined') {
    const csv = rows.map(r => r.map(c => { const s = String(c ?? ''); return /[,"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\r\n');
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename + '-' + today + '.csv'; a.click(); URL.revokeObjectURL(url);
    return;
  }
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = rows[0].map((_, i) => ({ wch: i === 1 ? 20 : 16 }));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, sheetName); XLSX.writeFile(wb, filename + '-' + today + '.xlsx');
}

  const oldSlug = getTenant();
  const input = prompt(
    `Текущее название: ${oldSlug}\n\nВведите новое название (латиница, цифры, _ и -):\n\n⚠️ После смены все старые ссылки на витрину перестанут работать.`,
    oldSlug
  );
  if (input === null) return;
  const newSlug = input.trim().toLowerCase();
  if (!newSlug) { showToast('Пустое имя', 'error'); return; }
  if (newSlug === oldSlug) { showToast('Имя не изменилось', 'info'); return; }
  if (!/^[a-z0-9_-]{2,30}$/.test(newSlug)) { showToast('Только латиница, цифры, _ и -', 'error'); return; }

  if (!confirm(`Переименовать «${oldSlug}» → «${newSlug}»?\n\nВсе данные (товары, продажи, пользователи) будут перенесены.`)) return;

  try {
    // проверяем, что новый slug свободен
    const check = await db.ref('evso/' + newSlug).once('value');
    if (check.exists()) { showToast('Это имя уже занято', 'error'); return; }

    // читаем все данные
    const dataSnap = await db.ref('evso/' + oldSlug).once('value');
    const data = dataSnap.val();
    if (!data) { showToast('Магазин не найден', 'error'); return; }

    // пишем в новый узел
    await db.ref('evso/' + newSlug).set(data);
    // удаляем старый
    await db.ref('evso/' + oldSlug).remove();

    // обновляем локальное состояние
    logAction('slug_change', `Магазин переименован: «${oldSlug}» → «${newSlug}»`);

    // записываем лог в новый узел
    const logId = uid('l');
    const entry = { id: logId, date: new Date().toISOString(), user: currentUser, action: 'slug_change', details: `Магазин переименован: «${oldSlug}» → «${newSlug}»` };
    await db.ref('evso/' + newSlug + '/log/' + logId).set(entry);

    setTenant(newSlug);
    haptic('add');
    showToast(`Магазин переименован в «${newSlug}»`);
    renderSettingsTab();
  } catch (e) {
    console.error(e);
    showToast('Ошибка: ' + (e.message || 'неизвестная'), 'error');
  }
}

/* ============ НАСТРОЙКИ: ФУНКЦИИ ============ */
function copyShopUrl() {
  const url = buildShopUrl();
  haptic();
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => showToast('Ссылка скопирована')).catch(() => prompt('Скопируйте:', url));
  } else prompt('Скопируйте:', url);
}
function updateSellerTg(val) {
  state.settings = state.settings || {};
  state.settings.sellerTelegram = (val || '').trim();
  saveLocal(); saveSettingsRemote(); showToast('Сохранено');
  logAction('settings_change', `Telegram продавца: ${state.settings.sellerTelegram || '—'}`);
}
function setShowOutOfStock(val) {
  state.settings = state.settings || {};
  state.settings.showOutOfStock = !!val;
  saveLocal(); saveSettingsRemote(); haptic();
  showToast(val ? 'Товары без остатка показываются' : 'Товары без остатка скрыты');
  logAction('settings_change', val ? 'Витрина: показывать товары без остатка' : 'Витрина: скрывать товары без остатка');
}

/* ============ СМЕНА СВОЕГО ПАРОЛЯ ============ */
function changeMyPass() {
  const p = $('myNewPass').value.trim(); if (!p) return;
  if (p.length < 4) { showToast('Пароль минимум 4 символа', 'error'); return; }
  state.users[currentUser] = { ...(state.users[currentUser] || {}), password: p };
  saveLocal(); saveUsersRemote();
  logAction('pass_change', 'Смена своего пароля');
  haptic(); showToast('Пароль изменён'); $('myNewPass').value = '';
}

/* ============ СОТРУДНИКИ ============ */
function addWorker() {
  const u = $('newWorkerLogin').value.trim();
  const p = $('newWorkerPass').value.trim();
  if (!u || !p) { showToast('Введите логин и пароль', 'error'); return; }
  if (!/^[a-zA-Zа-яА-Я0-9_\- ]{2,30}$/.test(u)) { showToast('Логин: 2-30 символов, без спецсимволов', 'error'); return; }
  if (p.length < 4) { showToast('Пароль минимум 4 символа', 'error'); return; }
  if (state.users[u]) { showToast('Такой логин уже есть', 'error'); return; }

  state.users[u] = { password: p, role: 'worker' };
  saveLocal(); saveUsersRemote();
  logAction('user_add', `Добавлен сотрудник «${u}»`);
  haptic('add');
  $('newWorkerLogin').value = ''; $('newWorkerPass').value = '';
  renderSettingsTab(); showToast('Сотрудник добавлен');
}

async function removeWorker(login) {
  if (!isAdmin()) { showToast('Только администратор может удалять', 'error'); return; }
  if (login === currentUser) { showToast('Нельзя удалить самого себя', 'error'); return; }
  const u = state.users[login];
  if (!u) return;
  if (u.role === 'admin') { showToast('Нельзя удалить администратора', 'error'); return; }
  if (!confirm(`Удалить сотрудника «${login}»?\n\nОн больше не сможет войти в магазин.`)) return;

  delete state.users[login];
  saveLocal(); saveUsersRemote();
  logAction('user_delete', `Удалён сотрудник «${login}»`);
  haptic('delete');
  renderSettingsTab(); showToast('Сотрудник удалён');
}

/* ============ НАЗВАНИЯ ТОЧЕК ============ */
function updateWhName(wh, name) {
  const old = state.warehouses[wh].name;
  const nw = name.trim() || (wh === 'wh1' ? 'Точка 1' : 'Точка 2');
  if (old === nw) return;
  state.warehouses[wh].name = nw;
  saveLocal(); saveWarehousesRemote();
  logAction('wh_rename', `Точка «${old}» переименована в «${nw}»`);
  haptic(); render();
}
