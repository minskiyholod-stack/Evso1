<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>evso</title>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="evso">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
[hidden] { display: none !important; }
:root{
  --bg:#f5f5f5;--card:#fff;--border:#e0e0e0;--text:#111;--muted:#737373;
  --black:#000;--white:#fff;--hover:#f0f0f0;--radius:10px;--danger:#dc2626;--success:#16a34a;
  --wh1:#ef4444;--wh2:#3b82f6;--safe-top: env(safe-area-inset-top, 0px);--safe-bottom: env(safe-area-inset-bottom, 0px);
}
body.dark {
  --bg: #0a0a0a; --card: #171717; --border: #2a2a2a; --text: #ededed;
  --muted: #8b8b8b; --black: #ffffff; --white: #000000; --hover: #222222;
}
body.dark .login-card, body.dark .app-header, body.dark .modal, body.dark .sales-wrap, body.dark .settings-section, body.dark .product-card, body.dark .stat, body.dark .menu-card, body.dark .role-card, body.dark .log-item, body.dark .user-row { background-color: var(--card); }
body.dark .btn { border-color: var(--border); }
body.dark .btn.primary { background: var(--white); color: var(--black); border-color: var(--white); }
body.dark .toast { background: #fff; color: #000; }
body.dark .user-row { background: #222; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:hidden;height:100%}
body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.4;overflow-x:hidden;width:100%;min-height:100%;transition:background .2s,color .2s;-webkit-text-size-adjust:100%}
input,select,textarea,button{font-family:inherit;font-size:16px}
#app, #shopScreen, #chooseScreen { animation: fadeIn 0.3s ease-in-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
.sync-bar{position:fixed;top:0;left:0;right:0;z-index:500;background:var(--danger);color:#fff;padding:8px 16px;padding-top:calc(8px + var(--safe-top));font-size:12.5px;font-weight:600;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.15)}
body.has-sync-bar .app-header{padding-top:calc(var(--safe-top) + 34px)}
body.has-sync-bar main{padding-top:calc(16px + 34px)}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--safe-bottom));transform:translateX(-50%) translateY(20px);background:var(--black);color:var(--white);padding:12px 18px;border-radius:10px;font-size:14px;font-weight:500;z-index:300;opacity:0;transition:all .25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:var(--danger);color:#fff !important}
.toast.success{background:var(--success);color:#fff !important}
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px 24px;width:100%;max-width:380px;box-shadow:0 4px 24px rgba(0,0,0,.05)}
.login-logo{font-size:36px;font-weight:900;letter-spacing:-1.5px;text-align:center;margin-bottom:2px}
.login-logo span{color:var(--muted)}
.login-sub{text-align:center;color:var(--muted);margin-bottom:24px;font-size:13px}
.login-card label{display:block;margin-bottom:12px;font-size:13px;color:var(--muted);font-weight:500}
.login-card input{display:block;width:100%;margin-top:5px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);font-size:16px}
.login-card input:focus{outline:none;border-color:var(--black)}
.btn.full{width:100%;margin-top:8px}
.login-error{color:var(--danger);text-align:center;margin-top:12px;font-size:13px;min-height:18px}
.login-shop-link{text-align:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.login-shop-link a{color:var(--muted);font-size:13px;text-decoration:none;font-weight:500}
.role-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px 14px;cursor:pointer;text-align:center;color:var(--text);transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit;width:100%}
.role-card:active{transform:scale(.98)}
.role-icon{font-size:40px;line-height:1;margin-bottom:6px}
.role-title{font-weight:800;font-size:15px}
.role-desc{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.35}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.app-header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--border);padding-top:var(--safe-top);transition:padding-top .2s}
.header-top{display:flex;align-items:center;gap:10px;padding:10px 16px 8px}
.logo{font-size:22px;font-weight:900;letter-spacing:-1.2px;cursor:pointer;user-select:none}
.logo span{color:var(--muted)}
.spacer{flex:1}
.user-chip{display:flex;align-items:center;gap:6px;background:var(--hover);padding:5px 11px;border-radius:20px;font-size:13px;font-weight:500;flex-shrink:0}
.dot-online{width:8px;height:8px;border-radius:50%;background:var(--success);flex-shrink:0}
.dot-online.off{background:#9ca3af}.dot-online.err{background:var(--danger)}
.user-chip button{background:none;border:none;color:var(--muted);cursor:pointer;padding:0 0 0 4px;font-size:12.5px}
.theme-toggle{background:none;border:none;color:var(--text);cursor:pointer;font-size:20px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px;flex-shrink:0}
.main-nav{display:flex;gap:2px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.main-nav::-webkit-scrollbar{display:none}
.main-nav button{background:none;border:none;color:var(--muted);font-weight:500;padding:8px 13px;border-radius:8px;cursor:pointer;font-size:14px;white-space:nowrap;flex-shrink:0}
.main-nav button.active{background:var(--black);color:var(--white)}
main{max-width:1280px;margin:0 auto;padding:16px;padding-bottom:calc(16px + var(--safe-bottom));overflow-x:hidden;width:100%}
@media(max-width:600px){main{padding:12px}}
.btn{background:var(--card);border:1px solid var(--border);color:var(--text);font-weight:500;padding:9px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;font-size:14px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:4px;text-decoration:none}
.btn:active{background:var(--hover)}
.btn.primary{background:var(--black);border-color:var(--black);color:var(--white)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.small{padding:6px 10px;font-size:13px;min-height:34px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.stat .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.stat .v{font-size:20px;font-weight:800;margin-top:3px}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.search{flex:1;min-width:130px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:16px}
select.search{flex:0 0 auto;min-width:auto;padding-right:24px;font-size:15px}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
@media(max-width:600px){.product-grid{grid-template-columns:repeat(2,1fr);gap:8px}}
.product-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;position:relative;cursor:pointer}
.product-card .photo{aspect-ratio:1;background:var(--hover);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.product-card .photo img{width:100%;height:100%;object-fit:cover}
.photo-placeholder{font-size:42px;opacity:.25}
.product-card .info{padding:8px 10px 10px;flex:1;display:flex;flex-direction:column;gap:2px}
.product-card .brand{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.product-card .name{font-size:13px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product-card .meta{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:var(--muted);margin-top:2px;gap:4px;flex-wrap:wrap}
.product-card .price{color:var(--text);font-size:13px;font-weight:700}
.shop-price{font-weight:800;font-size:16px;margin-top:4px}
.total-qty{margin-top:8px;padding-top:6px;border-top:1px dashed var(--border);font-size:12px;color:var(--muted)}
.total-qty b{color:var(--text);font-size:15px;font-weight:800;margin:0 2px}
.total-qty.empty-qty b{color:var(--danger)}
.card-buttons{margin-top:8px}
.sell-btn{width:100%;padding:8px;background:var(--black);color:var(--white);border:none;border-radius:8px;font-weight:600;font-size:12.5px;cursor:pointer;min-height:38px}
.sell-btn:disabled{background:var(--border);color:var(--muted);cursor:not-allowed}
.card-bottom-actions{display:flex;gap:6px;margin-top:6px}
.card-bottom-actions .btn{flex:1;padding:7px 6px;font-size:12px;min-height:34px}
.no-stock-overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;text-align:center;padding:8px}
.empty{padding:50px 20px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--border);border-radius:var(--radius)}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:100;overflow-y:auto;padding-top:var(--safe-top);padding-bottom:var(--safe-bottom)}
.modal-backdrop.show{display:flex}
@media(min-width:700px){.modal-backdrop{align-items:flex-start;padding:20px}}
.modal{background:var(--card);border-radius:16px 16px 0 0;width:100%;max-width:520px;padding:20px;margin:0;max-height:calc(100vh - var(--safe-top) - var(--safe-bottom));overflow-y:auto}
@media(min-width:700px){.modal{border-radius:14px;border:1px solid var(--border);max-height:calc(100vh - 40px)}.modal.wide{max-width:580px}}
.modal h3{margin:0 0 16px;font-size:17px}
.modal label{display:block;margin-bottom:12px;font-size:13px;color:var(--muted);font-weight:500}
.modal input,.modal select{display:block;width:100%;margin-top:5px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:11px 12px;color:var(--text);font-size:16px}
.modal-actions{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.modal-actions > button,.modal-actions > a{flex:1;justify-content:center}
.modal-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.view-photo{aspect-ratio:1;max-height:200px;background:var(--hover);display:flex;align-items:center;justify-content:center;border-radius:10px;margin-bottom:14px;overflow:hidden}
.view-photo img{width:100%;height:100%;object-fit:cover}
.view-photo .photo-placeholder{font-size:52px}
.view-sizes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.view-size-row{display:flex;align-items:center;gap:4px;padding:7px 8px;background:var(--hover);border-radius:8px;font-weight:600;font-size:13px}
.view-size-row.out{opacity:.45}
.vsr-size{flex:1;font-size:14px;font-weight:800}
.vsr-wh{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 5px;border-radius:6px;font-size:11.5px;font-weight:800}
.vsr-wh.wh1{background:rgba(239,68,68,.15);color:var(--wh1)}
.vsr-wh.wh2{background:rgba(59,130,246,.15);color:var(--wh2)}
.photo-section{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.photo-preview{width:90px;height:90px;border-radius:10px;overflow:hidden;background:var(--hover);display:flex;align-items:center;justify-content:center;border:1px solid var(--border);flex-shrink:0}
.photo-preview img{width:100%;height:100%;object-fit:cover}
.photo-preview .photo-placeholder{font-size:28px}
.sizes-section{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.edit-size-row{display:flex;align-items:center;gap:5px;padding:8px 10px;background:var(--hover);border-radius:8px;margin-bottom:6px;flex-wrap:wrap}
.esr-size{font-size:15px;font-weight:800;min-width:28px}
.esr-qty{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:2px 4px}
.esr-qty.wh1{border-color:rgba(239,68,68,.5)}
.esr-qty.wh2{border-color:rgba(59,130,246,.5)}
.esr-label{font-size:11px;font-weight:800;margin-right:2px}
.esr-qty.wh1 .esr-label{color:var(--wh1)}
.esr-qty.wh2 .esr-label{color:var(--wh2)}
.esr-qty button{width:26px;height:26px;border:none;background:var(--card);border-radius:4px;cursor:pointer;font-size:16px;font-weight:700;color:var(--text);display:flex;align-items:center;justify-content:center;padding:0}
.esr-val{min-width:22px;text-align:center;font-weight:700}
.esr-remove{margin-left:auto;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:0 6px;min-height:32px}
.size-preset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:5px}
.size-preset-btn{padding:9px 4px;background:var(--hover);border:1px solid var(--border);border-radius:6px;color:var(--text);font-weight:600;font-size:13px;cursor:pointer}
.size-preset-btn.active{background:var(--black);border-color:var(--black);color:var(--white)}
.delete-section{margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.sales-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--card)}
.table-scroll{overflow-x:auto}
.sales-table{width:100%;border-collapse:collapse}
.sales-table th,.sales-table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:13px;white-space:nowrap}
.sales-table th{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;background:var(--hover)}
.sales-table .num{text-align:right}
.sales-table td.wrap{white-space:normal;min-width:110px}
.filter-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;background:var(--black);color:var(--white);border-radius:20px;font-size:12px;font-weight:600}
.filter-badge button{background:none;border:none;color:inherit;cursor:pointer;font-size:16px;padding:0 0 0 2px}
.period-tabs{display:inline-flex;gap:2px;background:var(--hover);border-radius:8px;padding:3px;margin-bottom:14px}
.period-tabs button{background:none;border:none;padding:7px 13px;border-radius:6px;cursor:pointer;font-weight:500;color:var(--muted);font-size:13px}
.period-tabs button.active{background:var(--black);color:var(--white)}
.chart-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 12px 12px;margin-bottom:14px;overflow-x:auto}
.chart-bars{display:flex;gap:3px;align-items:flex-end;height:180px;min-width:100%}
.chart-bar-wrap{flex:1;min-width:14px;display:flex;flex-direction:column;height:100%;cursor:pointer}
.chart-bar-inner{flex:1;display:flex;align-items:flex-end}
.chart-bar{width:100%;background:var(--black);border-radius:2px 2px 0 0;min-height:2px}
.chart-bar.zero{background:var(--border)}
.chart-label{font-size:9px;color:var(--muted);margin-top:5px;text-align:center;font-weight:600}
.day-summary{padding:10px 14px;background:var(--hover);border-radius:8px;margin-bottom:16px;font-size:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.user-section{margin-bottom:16px}
.user-header{display:flex;justify-content:space-between;padding:8px 0;border-bottom:2px solid var(--black);font-weight:700;font-size:13.5px;margin-bottom:8px}
.user-sales{display:flex;flex-direction:column;gap:5px}
.sale-item{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;background:var(--hover);border-radius:6px;font-size:13px;align-items:center}
.sale-name{font-weight:600}
.sale-meta{color:var(--muted);font-size:11.5px;margin-top:2px}
.sale-price{font-weight:700;white-space:nowrap}
.hint-box{padding:10px 14px;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;margin-bottom:12px;font-size:12.5px;color:#78350f}
.log-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start}
.log-icon{font-size:22px;flex-shrink:0;margin-top:2px}
.log-body{flex:1;min-width:0}
.log-title{font-weight:600;font-size:13.5px;margin-bottom:3px;word-break:break-word}
.log-meta{font-size:11.5px;color:var(--muted)}
.log-meta b{color:var(--text)}
.settings-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.settings-section h3{margin:0 0 12px;font-size:15px}
.settings-section label{display:block;margin-bottom:10px;font-size:13px;color:var(--muted);font-weight:500}
.settings-section input{display:block;width:100%;margin-top:4px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:11px 12px;color:var(--text);font-size:16px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.status-line{padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:13px}
.status-line.ok{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
.status-line.warn{background:#fffbeb;color:#78350f;border:1px solid #fde68a}
.status-line.err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.muted{color:var(--muted)}
code{background:var(--hover);padding:1px 5px;border-radius:4px;font-size:12px}
.user-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--hover);border-radius:8px;margin-bottom:6px;font-size:13px}
.user-row .u-login{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.user-row .u-you{font-size:10.5px;color:var(--muted);font-weight:400}
.role-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;text-transform:uppercase;letter-spacing:.4px}
.role-badge.admin{background:rgba(239,68,68,.15);color:var(--wh1)}
.role-badge.worker{background:rgba(59,130,246,.15);color:var(--wh2)}
.menu-header{margin-bottom:20px}
.menu-header h1{font-size:26px;font-weight:900;margin:0 0 4px}
.menu-header p{margin:0;color:var(--muted);font-size:13.5px}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
@media(max-width:600px){.menu-grid{grid-template-columns:1fr 1fr;gap:10px}.menu-header h1{font-size:22px}}
.menu-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 14px;cursor:pointer;text-align:left;color:var(--text);display:flex;flex-direction:column;gap:3px;min-height:130px;font-family:inherit}
.menu-icon{font-size:32px;margin-bottom:6px;line-height:1}
.menu-title{font-size:17px;font-weight:800}
.menu-sub{font-size:12px;color:var(--muted);line-height:1.35}
.shop-hero{padding:8px 0 16px}
.shop-hero h1{font-size:26px;font-weight:900;margin:0 0 4px}
.shop-hero p{margin:0;color:var(--muted);font-size:13.5px}
.shop-modal-actions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.shop-modal-actions .btn{flex:1;min-width:100px}
.shop-modal-actions .btn.icon{flex:0 0 52px;min-width:52px;padding:0}
.icon-btn{padding:0;min-width:34px;width:34px}
</style>
</head>
<body>

<div id="syncBar" class="sync-bar" hidden>⚠️ Проблемы с синхронизацией</div>

<div id="chooseScreen" class="login-screen" hidden>
  <div class="login-card" style="max-width:460px">
    <div class="login-logo">evso<span>.</span></div>
    <div class="login-sub">Кто вы?</div>
    <div class="role-grid">
      <button class="role-card" onclick="chooseRole('buyer')"><div class="role-icon">🛍</div><div class="role-title">Я покупатель</div><div class="role-desc">Смотреть каталог</div></button>

<script>
const DEFAULT_FB_URL = 'https://evso-cd735-default-rtdb.europe-west1.firebasedatabase.app';
const SAVE_DELAY = 500, RENDER_DELAY = 150, SEARCH_DELAY = 200, LOG_LIMIT_LOCAL = 200, PHOTO_MAX_SIZE = 350, PHOTO_QUALITY = 0.7;
const STATE_KEY = 'evso_state', PHOTOS_KEY = 'evso_photos', USER_KEY = 'evso_user';
const DEFAULT_BRANDS = ['Adidas','Nike','Reebok','Asics','Columbia','Hoka','Bona','Salomon','The North Face','New Balance','ACG','Saucony','Armani','Vans','DC','Merrell'];
const CATEGORIES = ['36-41', '40-50'];

let state = { warehouses: { wh1:{name:'Точка 1'}, wh2:{name:'Точка 2'} }, products: {}, sales: {}, log: {}, customBrands: [], users: {}, settings: { sellerTelegram: '', showOutOfStock: true } };
let db = null, useFirebase = false, currentUser = '', activeTab = 'menu';
let filters = { search:'', brand:'', category:'', size:'' };
let shopFilters = { search:'', brand:'', size:'', category:'', sort:'default' };
let editingProduct = null, editingPhoto = '';
let statsPeriod = 'week', firebaseReady = false, syncOnline = false, syncError = false;

const $ = id => document.getElementById(id);
let uidCounter = 0;
const uid = p => (p||'x') + Date.now().toString(36) + '_' + (++uidCounter).toString(36) + Math.random().toString(36).slice(2,5);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('ru-RU', { maximumFractionDigits: 2 });
const dayKey = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const qty = v => { const n = parseInt(v); return isNaN(n) ? 0 : n; };
const plural = (n, one, few, many) => { const m = n % 100; if (m >= 11 && m <= 19) return many; const m10 = n % 10; if (m10 === 1) return one; if (m10 >= 2 && m10 <= 4) return few; return many; };

function debounce(fn, ms) { let timer; return function(...args) { clearTimeout(timer); timer = setTimeout(() => fn.apply(this, args), ms); }; }
function haptic(type) { if (!navigator.vibrate) return; try { if (type === 'success') navigator.vibrate(15); else if (type === 'delete') navigator.vibrate([10, 30, 10]); else if (type === 'add') navigator.vibrate([5, 20, 5]); else navigator.vibrate(10); } catch (e) {} }
let _toastEl = null;
function showToast(message, type = 'success') { if (!_toastEl) { _toastEl = document.createElement('div'); _toastEl.className = 'toast'; document.body.appendChild(_toastEl); } _toastEl.textContent = message; _toastEl.className = 'toast ' + type; requestAnimationFrame(() => _toastEl.classList.add('show')); clearTimeout(_toastEl._timer); _toastEl._timer = setTimeout(() => _toastEl.classList.remove('show'), 3500); }

function migrateState() {
  if (!state.products || typeof state.products !== 'object') state.products = {};
  if (!state.sales || typeof state.sales !== 'object' || Array.isArray(state.sales)) state.sales = {};
  if (!state.log || typeof state.log !== 'object' || Array.isArray(state.log)) state.log = {};
  if (!state.customBrands || !Array.isArray(state.customBrands)) state.customBrands = [];
  if (!state.users || typeof state.users !== 'object') state.users = {};
  if (!state.settings || typeof state.settings !== 'object') state.settings = { sellerTelegram: '', showOutOfStock: true };
  if (state.settings.showOutOfStock === undefined) state.settings.showOutOfStock = true;
  Object.values(state.products).forEach(p => {
    if (p.gender && !p.category) { p.category = p.gender === 'Женские' ? '36-41' : '40-50'; delete p.gender; }
    if (!p.sizes) { p.sizes = {}; return; }
    Object.keys(p.sizes).forEach(size => {
      const s = p.sizes[size]; if (!s) return;
      if (typeof s.wh1 === 'boolean') s.wh1 = s.wh1 ? 1 : 0; if (typeof s.wh2 === 'boolean') s.wh2 = s.wh2 ? 1 : 0;
      s.wh1 = qty(s.wh1); s.wh2 = qty(s.wh2);
    });
  });
}

function applyTheme() { const t = localStorage.getItem('evso_theme') || 'light'; const isDark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches); document.body.classList.toggle('dark', isDark); document.querySelectorAll('.theme-toggle').forEach(b => b.textContent = isDark ? '☀️' : '🌙'); }
function toggleTheme() { const isDark = document.body.classList.contains('dark'); localStorage.setItem('evso_theme', isDark ? 'light' : 'dark'); applyTheme(); haptic(); if (activeTab === 'settings' && !$('app').hidden) renderSettingsTab(); }
applyTheme();

function getAllBrands() { const customs = state.customBrands || []; return [...new Set([...DEFAULT_BRANDS, ...customs])].sort(); }
function getAllAvailableSizes() { const sizes = new Set(); Object.values(state.products).forEach(p => { Object.keys(p.sizes || {}).forEach(s => { if (qty(p.sizes[s].wh1) + qty(p.sizes[s].wh2) > 0) sizes.add(s); }); }); return [...sizes].sort((a, b) => parseFloat(a) - parseFloat(b)); }

const LOG_ICONS = { 'sale': '💰', 'product_add': '➕', 'product_edit': '✏️', 'product_delete': '🗑', 'sales_clear': '🧹', 'user_add': '👤', 'user_delete': '🚫', 'pass_change': '🔑', 'wh_rename': '🏪', 'backup_restore': '♻️', 'settings_change': '⚙️', 'log_clear': '📜' };
function logAction(action, details) { if (!currentUser) return; const id = uid('l'); const entry = { id, date: new Date().toISOString(), user: currentUser, action, details: details || '' }; if (!state.log) state.log = {}; state.log[id] = entry; pruneLocalLog(); saveLocal(); if (useFirebase) db.ref('evso/log/' + id).set(entry).catch(e => console.error(e)); if (activeTab === 'log') scheduleRender(); }
function pruneLocalLog() { const keys = Object.keys(state.log); if (keys.length <= LOG_LIMIT_LOCAL) return; keys.sort((a, b) => new Date(state.log[a].date) - new Date(state.log[b].date)); keys.slice(0, keys.length - LOG_LIMIT_LOCAL).forEach(k => { delete state.log[k]; }); }

function initAuth() {
  currentUser = localStorage.getItem(USER_KEY) || '';
  loadLocal();
  initFirebase();
  if (currentUser) {
    db.ref('evso/users').once('value').then(snap => {
      let users = snap.val();
      if (!users || !users[currentUser]) { localStorage.removeItem(USER_KEY); currentUser = ''; showChoose(); }
      else { showApp(); }
    }).catch(() => showChoose());
  } else { showChoose(); }
}
function showChoose() { $('chooseScreen').hidden = false; $('loginScreen').hidden = true; $('app').hidden = true; $('shopScreen').hidden = true; }
function chooseRole(role) { haptic(); if (role === 'buyer') { showShop(); } else { $('chooseScreen').hidden = true; showLogin(); } }
function backToChoose() { haptic(); if (currentUser) showApp(); else showChoose(); }
function showLogin() {
  $('chooseScreen').hidden = true; $('loginScreen').hidden = false; $('app').hidden = true; $('shopScreen').hidden = true;
  $('loginForm').onsubmit = e => {
    e.preventDefault(); const f = new FormData(e.target); const user = f.get('user').trim().toLowerCase(); const pass = f.get('pass');
    initFirebase();
    db.ref('evso/users').once('value').then(snap => {
      let users = snap.val();
      if (!users || Object.keys(users).length === 0) {
        users = { 'admin': { password: '12345', role: 'admin' } };
        db.ref('evso/users').set(users);
      }
      const userData = users[user];
      const actualPass = (userData && typeof userData === 'object') ? userData.password : userData;
      if (!userData || actualPass !== pass) { $('loginError').textContent = 'Неверный логин или пароль'; haptic('delete'); return; }
      state.users = users; localStorage.setItem(USER_KEY, user); currentUser = user; $('loginError').textContent = ''; haptic('success'); showApp();
    }).catch(err => { $('loginError').textContent = 'Ошибка соединения'; });
  };
}
function showApp() {
  $('chooseScreen').hidden = true; $('loginScreen').hidden = true; $('shopScreen').hidden = true; $('app').hidden = false;
  $('userName').textContent = currentUser; activeTab = 'menu';
  document.querySelectorAll('.main-nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === 'menu'));
  ['menu','products','sales','stats','log','settings'].forEach(t => { const sec = $('tab-' + t); if (sec) sec.hidden = t !== 'menu'; });
  window.scrollTo(0, 0); render(); setupRealtime();
}
function logout() {
  if (!confirm('Выйти из аккаунта?')) return;
  flushSave(); localStorage.removeItem(USER_KEY); localStorage.removeItem(STATE_KEY); localStorage.removeItem(PHOTOS_KEY); currentUser = ''; window.location.reload();
}

// SHOP
let _shopBound = false, _shopRealtime = false;
function showShop() {
  $('chooseScreen').hidden = true; $('loginScreen').hidden = true; $('app').hidden = true; $('shopScreen').hidden = false;
  if (!_shopBound) { bindShopFilters(); _shopBound = true; }
  if (!_shopRealtime) { setupShopRealtime(); _shopRealtime = true; }
}
function bindShopFilters() {
  const onSearch = debounce(e => { shopFilters.search = e.target.value; renderShopGrid(); }, SEARCH_DELAY);
  $('shopSearch')?.addEventListener('input', onSearch);
  $('shopBrand')?.addEventListener('change', e => { shopFilters.brand = e.target.value; renderShopGrid(); });
  $('shopSize')?.addEventListener('change', e => { shopFilters.size = e.target.value; renderShopGrid(); });
  $('shopCategory')?.addEventListener('change', e => { shopFilters.category = e.target.value; renderShopGrid(); });
  $('shopSort')?.addEventListener('change', e => { shopFilters.sort = e.target.value; renderShopGrid(); });
}
function setupShopRealtime() {
  if (!initFirebase()) { renderShop(); return; }
  const err = e => { syncError = true; updateSyncBar(); };
  db.ref('evso/products').on('child_added', snap => { state.products[snap.key] = snap.val(); renderShop(); }, err);
  db.ref('evso/products').on('child_changed', snap => { state.products[snap.key] = snap.val(); renderShop(); }, err);
  db.ref('evso/products').on('child_removed', snap => { delete state.products[snap.key]; renderShop(); }, err);
  db.ref('evso/warehouses').on('value', snap => { const v = snap.val(); if (v) { state.warehouses = v; renderShop(); } }, err);
  db.ref('evso/settings').on('value', snap => { const v = snap.val(); if (v) { state.settings = v; renderShop(); } }, err);
  renderShop();
}
function renderShop() {
  const entries = Object.entries(state.products); const totalQty = entries.reduce((a, [, p]) => a + getTotalQty(p), 0);
  const sub = $('shopSubtitle'); if (sub) sub.textContent = entries.length ? `${entries.length} моделей · ${totalQty} пар в наличии` : 'Пока пусто';
  const brands = [...new Set(entries.map(([, p]) => p.brand).filter(Boolean))].sort(); const brandSel = $('shopBrand');
  if (brandSel) { const cv = shopFilters.brand; brandSel.innerHTML = '<option value="">Все бренды</option>' + brands.map(b => `<option value="${esc(b)}"${cv === b ? ' selected' : ''}>${esc(b)}</option>`).join(''); }
  const sizes = getAllAvailableSizes(); const sizeSel = $('shopSize');
  if (sizeSel) { const cv = shopFilters.size; sizeSel.innerHTML = '<option value="">Размер</option>' + sizes.map(s => `<option value="${esc(s)}"${cv === s ? ' selected' : ''}>${esc(s)}</option>`).join(''); }
  renderShopGrid();
}
function renderShopGrid() {
  const grid = $('shopGrid'); if (!grid) return;
  const showOut = state.settings?.showOutOfStock !== false;
  let entries = Object.entries(state.products).filter(([, p]) => showOut || getTotalQty(p) > 0);
  const q = shopFilters.search.toLowerCase().trim();
  entries = entries.filter(([, p]) => {
    if (q && !((p.name||'').toLowerCase().includes(q) || (p.brand||'').toLowerCase().includes(q))) return false;
    if (shopFilters.brand && p.brand !== shopFilters.brand) return false;
    if (shopFilters.category && p.category !== shopFilters.category) return false;
    if (shopFilters.size) { const sz = p.sizes?.[shopFilters.size]; if (!sz || (qty(sz.wh1) + qty(sz.wh2)) === 0) return false; }
    return true;
  });
  if (shopFilters.sort === 'price_asc') entries.sort((a, b) => (a[1].price||0) - (b[1].price||0));
  else if (shopFilters.sort === 'price_desc') entries.sort((a, b) => (b[1].price||0) - (a[1].price||0));
  else if (shopFilters.sort === 'name') entries.sort((a, b) => (a[1].name||'').localeCompare(b[1].name||''));
  if (!entries.length) { grid.innerHTML = '<div class="empty" style="grid-column:1/-1">Товаров не найдено</div>'; return; }
  grid.innerHTML = entries.map(([id, p]) => renderShopProductCard(id, p)).join('');
}
function renderShopProductCard(id, p) {
  const total = getTotalQty(p); const attrs = [p.category, p.season].filter(Boolean).join(' · ');
  return `<div class="product-card" onclick="openShopProductView('${id}')"><div class="photo">${p.photo ? `<img src="${p.photo}" alt="" loading="lazy">` : '<div class="photo-placeholder">👟</div>'}${total === 0 ? '<div class="no-stock-overlay">Нет в наличии</div>' : ''}</div><div class="info">${p.brand ? `<div class="brand">${esc(p.brand)}</div>` : ''}<div class="name">${esc(p.name)}</div>${attrs ? `<div class="meta"><span>${esc(attrs)}</span></div>` : ''}${p.price ? `<div class="shop-price">${fmt(p.price)} ₽</div>` : ''}</div></div>`;
}
function openShopProductView(productId) {
  const p = state.products[productId]; if (!p) return showToast('Товар не найден', 'error');
  const sizes = Object.keys(p.sizes || {}).sort((a, b) => parseFloat(a) - parseFloat(b));
  const totalQty = getTotalQty(p); const attrs = [p.category, p.season].filter(Boolean).join(' · ');
  const sizesHtml = sizes.map(size => { const total = qty(p.sizes[size].wh1) + qty(p.sizes[size].wh2); return `<div class="view-size-row ${total === 0 ? 'out' : ''}"><span class="vsr-size">${esc(size)}</span><span style="font-weight:800">${total}</span></div>`; }).join('');
  const tgUser = (state.settings?.sellerTelegram || '').replace(/^@/, '').trim(); let tgUrl = '';
  if (tgUser) { const msg = encodeURIComponent(`Здравствуйте! Интересует: ${p.brand || ''} ${p.name}${p.price ? ' — ' + p.price + ' ₽' : ''}`); tgUrl = `https://t.me/${tgUser}?text=${msg}`; }
  let actionHtml; if (totalQty > 0) { actionHtml = tgUrl ? `<a href="${tgUrl}" target="_blank" class="btn primary">💬 Написать</a>` : `<button class="btn primary" onclick="showToast('Продавец не указал Telegram','error')">💬 Написать</button>`; } else { actionHtml = `<button class="btn" disabled style="opacity:.5">Нет в наличии</button>`; }
  openModal(`<div class="view-photo">${p.photo ? `<img src="${p.photo}" alt="">` : '<div class="photo-placeholder">👟</div>'}</div>${p.brand ? `<div style="text-transform:uppercase;color:var(--muted);font-size:11px;font-weight:700">${esc(p.brand)}</div>` : ''}<h3 style="margin:4px 0 6px">${esc(p.name)}</h3>${attrs ? `<div class="muted" style="font-size:13px;margin-bottom:8px">${esc(attrs)}</div>` : ''}${p.price ? `<div style="font-size:24px;font-weight:800;margin-bottom:4px">${fmt(p.price)} ₽</div>` : ''}${totalQty > 0 ? `<div style="font-size:12px;color:var(--success);font-weight:600;margin-bottom:12px">● В наличии (${totalQty} пар)</div>` : `<div style="font-size:12px;color:var(--muted);font-weight:600;margin-bottom:12px">○ Нет в наличии</div>`}${sizes.length ? `<div style="margin:12px 0"><div style="font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:700">Размеры</div><div class="view-sizes-grid">${sizesHtml}</div></div>` : ''}<div class="shop-modal-actions"><button class="btn icon" onclick="shareProduct('${productId}')">🔗</button>${actionHtml}</div><div style="margin-top:10px"><button class="btn" style="width:100%" onclick="closeModal()">Закрыть</button></div>`);
}
function buildShopUrl(productId) { return window.location.origin + window.location.pathname + (productId ? '?product=' + productId : ''); }
async function shareShop() { const url = buildShopUrl(); haptic(); if (navigator.share) { try { await navigator.share({ title: 'evso — каталог', url }); return; } catch (e) { if (e.name === 'AbortError') return; } } try { await navigator.clipboard.writeText(url); showToast('Скопировано'); } catch (e) { prompt('Скопируйте:', url); } }
async function shareProduct(productId) { const p = state.products[productId]; if (!p) return; const url = buildShopUrl(productId); haptic(); if (navigator.share) { try { await navigator.share({ title: p.name, url }); return; } catch (e) { if (e.name === 'AbortError') return; } } try { await navigator.clipboard.writeText(url); showToast('Скопировано'); } catch (e) { prompt('Скопируйте:', url); } }

function initFirebase() { const url = DEFAULT_FB_URL; if (!url || typeof firebase === 'undefined') return false; try { if (!firebase.apps.length) firebase.initializeApp({ databaseURL: url }); db = firebase.database(); return true; } catch (e) { return false; } }

async function setupRealtime() {
  useFirebase = initFirebase(); if (!useFirebase) { updateSync(false); return; }
  db.ref('.info/connected').on('value', s => { syncOnline = s.val() === true; updateSync(syncOnline); });
  try {
    const snap = await db.ref('evso').once('value'); const data = snap.val();
    if (!data) await db.ref('evso').set({ warehouses: state.warehouses, products: state.products, sales: state.sales, customBrands: state.customBrands, settings: state.settings });
    else { if (!data.warehouses) db.ref('evso/warehouses').set(state.warehouses); if (!data.customBrands) db.ref('evso/customBrands').set(state.customBrands || []); if (!data.settings) db.ref('evso/settings').set(state.settings); }
  } catch (e) { updateSync(false, true); return; }
  firebaseReady = true; const err = e => { updateSync(false, true); };
  db.ref('evso/warehouses').on('value', snap => { const v = snap.val(); if (v) { state.warehouses = v; saveLocal(); scheduleRender(); } }, err);
  db.ref('evso/customBrands').on('value', snap => { const v = snap.val(); if (v) { state.customBrands = v; saveLocal(); scheduleRender(); } }, err);
  db.ref('evso/settings').on('value', snap => { const v = snap.val(); if (v) { state.settings = v; saveLocal(); scheduleRender(); } }, err);
  db.ref('evso/users').on('value', snap => { const v = snap.val(); if (v) { state.users = v; saveLocal(); scheduleRender(); } }, err);
  db.ref('evso/products').on('child_added', snap => { state.products[snap.key] = snap.val(); saveLocal(); scheduleRender(); }, err);
  db.ref('evso/products').on('child_changed', snap => { state.products[snap.key] = snap.val(); saveLocal(); scheduleRender(); }, err);
  db.ref('evso/products').on('child_removed', snap => { delete state.products[snap.key]; saveLocal(); scheduleRender(); }, err);
  db.ref('evso/sales').on('child_added', snap => { const v = snap.val(); if (v) { state.sales[snap.key] = v; saveLocal(); scheduleRender(); } }, err);
  db.ref('evso/sales').on('child_changed', snap => { const v = snap.val(); if (v) { state.sales[snap.key] = v; saveLocal(); scheduleRender(); } }, err);
  db.ref('evso/sales').on('child_removed', snap => { delete state.sales[snap.key]; saveLocal(); scheduleRender(); }, err);
  db.ref('evso/log').on('child_added', snap => { const v = snap.val(); if (!v) return; if (!state.log) state.log = {}; if (state.log[snap.key]) return; state.log[snap.key] = v; pruneLocalLog(); saveLocal(); if (activeTab === 'log') scheduleRender(); }, err);
  updateSync(true);

  if (statsPeriod === 'week') {
    const day = now.getDay(); // 0-вс, 1-пн, 2-вт...
    const diff = (day < 2) ? day + 5 : day - 2; // Если пн, то отнимаем 6 дней (прошлый вторник)
    startDate = new Date(now); startDate.setDate(now.getDate() - diff);
    endDate = new Date(startDate); endDate.setDate(startDate.getDate() + 5); endDate.setHours(23,59,59,999);
    daysCount = 6;
  } else {
    endDate = new Date(now); endDate.setHours(23,59,59,999);
    startDate = new Date(now); startDate.setDate(now.getDate() - (statsPeriod - 1));
    daysCount = statsPeriod;
  }

  // 2. Фильтруем продажи
  const inP = sales.filter(s => { const d = new Date(s.date); return d >= startDate && d <= endDate; });
  const pTotal = inP.reduce((a, s) => a + (+s.price || 0), 0);

  // 3. График
  const dm = {};
  if (statsPeriod === 'week') {
    for (let i = 0; i < 6; i++) {
      const d = new Date(startDate); d.setDate(startDate.getDate() + i);
      dm[dayKey(d)] = { key: dayKey(d), date: d, total: 0, count: 0, isToday: d.getTime() === now.getTime() };
    }
  } else {
    for (let i = statsPeriod - 1; i >= 0; i--) {
      const d = new Date(now); d.setDate(now.getDate() - i);
      dm[dayKey(d)] = { key: dayKey(d), date: d, total: 0, count: 0, isToday: i === 0 };
    }
  }
  inP.forEach(s => {
    const d = new Date(s.date); d.setHours(0,0,0,0);
    const day = dm[dayKey(d)];
    if (day) { day.total += +s.price || 0; day.count++; }
  });
  const days = Object.values(dm).sort((a,b) => a.date - b.date);
  const mx = Math.max(...days.map(d => d.total), 1);
  const bars = days.map(d => {
    const h = d.total > 0 ? Math.max(2, (d.total/mx)*100) : 0;
    return `<div class="chart-bar-wrap ${d.isToday?'today':''}"><div class="chart-bar-inner"><div class="chart-bar ${d.total===0?'zero':''}" style="height:${h}%"></div></div><div class="chart-label">${d.date.getDate()}</div></div>`;
  }).join('');

  // 4. Статистика по сотрудникам
  const uStats = {};
  Object.keys(state.users || {}).forEach(u => { uStats[u] = { total: 0, count: 0 }; });
  inP.forEach(s => {
    const u = s.user || 'Неизвестно';
    if (!uStats[u]) uStats[u] = { total: 0, count: 0 };
    uStats[u].total += +s.price || 0;
    uStats[u].count++;
  });
  const userHtml = Object.entries(uStats)
    .sort((a, b) => b[1].total - a[1].total)
    .map(([u, d]) => `
      <div class="stat" style="grid-column: 1 / -1;">
        <div class="k" style="color:var(--text);font-size:13px;text-transform:none">👤 ${esc(u)}</div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:4px">
          <span class="v" style="font-size:18px">${fmt(d.total)} ₽</span>
          <span class="muted" style="font-size:12px">${d.count} пар</span>
        </div>
      </div>
    `).join('');

  $('tab-stats').innerHTML = `
    <div class="period-tabs">
      <button class="${statsPeriod==='week'?'active':''}" onclick="statsPeriod='week';renderStatsTab()">Неделя (Вт-Вс)</button>
      ${[7,14,30,90].map(p => `<button class="${statsPeriod===p?'active':''}" onclick="statsPeriod=${p};renderStatsTab()">${p} дн.</button>`).join('')}
    </div>
    <div class="stats">
      <div class="stat"><div class="k">Выручка</div><div class="v">${fmt(pTotal)} ₽</div></div>
      <div class="stat"><div class="k">Продано</div><div class="v">${inP.length} пар</div></div>
    </div>
    
    <div class="menu-header" style="margin-top:20px;margin-bottom:10px"><h2 style="font-size:18px;margin:0">По сотрудникам</h2></div>
    <div class="stats">${userHtml}</div>

    <div class="menu-header" style="margin-top:20px;margin-bottom:10px"><h2 style="font-size:18px;margin:0">График продаж</h2></div>
    <div class="chart-wrap"><div class="chart-bars">${bars}</div></div>
  `;
}

function renderLogTab() { const e = Object.values(state.log || {}).sort((a, b) => new Date(b.date) - new Date(a.date)); const el = $('tab-log'); if (!el) return; if (!e.length) return el.innerHTML = '<div class="empty">Лог пуст</div>'; el.innerHTML = e.slice(0, 300).map(x => `<div class="log-item"><div class="log-icon">${LOG_ICONS[x.action]||'•'}</div><div class="log-body"><div class="log-title">${esc(x.details||x.action)}</div><div class="log-meta"><b>${esc(x.user||'—')}</b> · ${new Date(x.date).toLocaleString('ru-RU')}</div></div></div>`).join(''); }

function exportSales() { const sales = Object.values(state.sales || {}).sort((a, b) => new Date(b.date) - new Date(a.date)); if (!sales.length) return showToast('Нет продаж', 'error'); const rows = [['Дата','Продавец','Бренд','Модель','Размер','Точка','Цена']]; sales.forEach(s => rows.push([new Date(s.date).toLocaleString('ru-RU'), s.user||'', s.brand||'', s.productName||'', s.size, s.whName||'', s.price||0])); doExport(rows, 'Продажи', 'evso-prodazhi'); }
function doExport(rows, sn, fn) { const today = new Date().toISOString().slice(0,10); if (typeof XLSX === 'undefined') { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'; s.onload = () => doExport(rows, sn, fn); document.head.appendChild(s); return; } const ws = XLSX.utils.aoa_to_sheet(rows); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, sn); XLSX.writeFile(wb, fn+'-'+today+'.xlsx'); }

function renderSettingsTab() {
  const isAdmin = currentUser === 'admin';
  const usersList = Object.keys(state.users || {}).map(login => {
    const isMe = login === currentUser;
    return `<div class="user-row">
      <span class="u-login">${esc(login)} ${isMe ? '<span class="u-you">(вы)</span>' : ''}</span>
      <span class="role-badge ${login === 'admin' ? 'admin' : 'worker'}">${login === 'admin' ? 'ADMIN' : 'WORKER'}</span>
      ${isAdmin && login !== 'admin' ? `<button class="btn small danger" onclick="deleteUser('${esc(login)}')">Удалить</button>` : ''}
    </div>`;
  }).join('');

  $('tab-settings').innerHTML = `
    <div class="settings-section">
      <h3>🛍 Витрина</h3>
      <label>Ссылка для покупателей<input value="${esc(buildShopUrl())}" readonly onclick="this.select()"></label>
      <div class="row-actions"><button class="btn" onclick="copyShopUrl()">Копировать</button><button class="btn primary" onclick="window.open(buildShopUrl(),'_blank')">Открыть</button></div>
      <label style="margin-top:14px">Telegram<input id="sellerTg" value="${esc(state.settings?.sellerTelegram||'')}" onchange="updateSellerTg(this.value)"></label>
    </div>

    <div class="settings-section">
      <h3>👤 Мой аккаунт</h3>
      <p style="margin:0 0 8px">Ваш логин: <b>${esc(currentUser)}</b></p>
      <div style="border-top:1px dashed var(--border);padding-top:12px;margin-top:12px">
        <div style="font-size:13px;font-weight:600;margin-bottom:8px">Сменить пароль</div>
        <div class="modal-row" style="margin-bottom:8px">
          <input id="myNewPass" type="password" placeholder="Новый пароль" style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text)">
          <button class="btn" onclick="changeMyPass()">Сменить</button>
        </div>
      </div>
    </div>

    ${isAdmin ? `
    <div class="settings-section">
      <h3>👥 Сотрудники</h3>
      <p class="muted" style="font-size:12.5px;margin:0 0 10px">Сотрудники имеют те же права, что и вы, но не могут удалять других и менять настройки синхронизации.</p>
      <div style="margin-bottom:12px">${usersList}</div>
      <div style="border-top:1px dashed var(--border);padding-top:12px;margin-top:12px">
        <div style="font-size:13px;font-weight:600;margin-bottom:8px">Добавить нового</div>
        <div class="modal-row" style="margin-bottom:8px">
          <input id="newUserLogin" placeholder="Логин" autocapitalize="none" style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text)">
          <input id="newUserPass" type="password" placeholder="Пароль" style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text)">
        </div>
        <button class="btn full" onclick="addUser()">+ Создать сотрудника</button>
      </div>
    </div>
    ` : ''}

    <div class="settings-section"><h3>Синхронизация</h3><div class="status-line ${useFirebase?(syncError?'err':(syncOnline?'ok':'warn')):'warn'}"><strong>${!useFirebase?'Локально':(syncError?'Ошибка':(syncOnline?'🟢 Онлайн':'Подключение'))}</strong></div></div>
    <div class="settings-section"><h3>Действия</h3><button class="btn danger full" onclick="logout()">Выйти</button></div>
  `;
}

function copyShopUrl() { navigator.clipboard.writeText(buildShopUrl()).then(() => showToast('Скопировано')); }
function updateSellerTg(v) { state.settings = state.settings || {}; state.settings.sellerTelegram = v.trim(); saveLocal(); saveSettingsRemote(); }

function changeMyPass() {
  const p = $('myNewPass').value.trim();
  if (p.length < 4) return showToast('Минимум 4 символа', 'error');
  if (state.users[currentUser]) {
    state.users[currentUser].password = p;
    saveLocal(); saveUsersRemote();
    logAction('pass_change', 'Смена пароля');
    showToast('Пароль изменён');
    $('myNewPass').value = '';
  }
}

function addUser() {
  const u = $('newUserLogin').value.trim().toLowerCase();
  const p = $('newUserPass').value.trim();
  if (!u || p.length < 4) return showToast('Введите логин и пароль (от 4 символов)', 'error');
  if (state.users[u]) return showToast('Такой логин уже есть', 'error');
  
  state.users[u] = { password: p, role: 'worker' };
  saveLocal(); saveUsersRemote();
  logAction('user_add', `Добавлен сотрудник «${u}»`);
  haptic('add');
  $('newUserLogin').value = ''; $('newUserPass').value = '';
  renderSettingsTab();
  showToast('Сотрудник добавлен');
}

function deleteUser(u) {
  if (!confirm(`Удалить сотрудника «${u}»?`)) return;
  delete state.users[u];
  saveLocal(); saveUsersRemote();
  logAction('user_delete', `Удалён «${u}»`);
  haptic('delete');
  renderSettingsTab();
  showToast('Удалён');
}

initAuth();
</script>
</body>
</html>
